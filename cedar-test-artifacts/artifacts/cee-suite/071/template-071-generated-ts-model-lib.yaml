    modifiedBy: "https://metadatacenter.org/users/30449a1f-80a8-4b54-a3fa-92d4d6157116"
    prefLabel: "Data File Temporal Coverage"
    children:
      - key: "Temporal Extent Minimum Value"
        type: temporal-field
        name: "Temporal Extent Minimum Value"
        description: "The start date (and optionally time) of the data.\n\nNote that dates must be specified in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format. This format specifies date/times in a locale neutral way with temporal components ordered largest to smallest, for example year, month, day. Note that times are in 24 hour clock (military time) format, thus 13:43 is 1:43pm. When times are specified a time zone must also be specified (Z or +00:00 indicates Greenwich Mean Time).\n\nThe date time 2022-11-23T01:23:45.678-07:00 specifies November 23, 2022 at just past 1:23am Pacific Daylight Time. Hyphens and colons are optional.\n\nThe date 2022-09-23 specifies September 23, 2022 (without a time stamp). Dates are assumed GMT if no time zone is specified."
        identifier: "temporal_extent_minimum_value"
        id: "https://repo.metadatacenter.org/template-fields/a1babe33-3354-40bb-8674-864c8ae08a56"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Temporal Extent Minimum Value"
        datatype: xsd:date
        granularity: day
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/temporalExtentMinimumValue"
      - key: "Temporal Extent Maximum Value"
        type: temporal-field
        name: "Temporal Extent Maximum Value"
        description: "The end date (and optionally time) of the data.\n\nNote that dates must be specified in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format. This format specifies date/times in a locale neutral way with temporal components ordered largest to smallest, for example year, month, day. Note that times are in 24 hour clock (military time) format, thus 13:43 is 1:43pm. When times are specified a time zone must also be specified (Z or +00:00 indicates Greenwich Mean Time).\n\nThe date time 2022-11-23T01:23:45.678-07:00 specifies November 23, 2022 at just past 1:23am Pacific Daylight Time. Hyphens and colons are optional.\n\nThe date 2022-09-23 specifies September 23, 2022 (without a time stamp). Dates are assumed GMT if no time zone is specified."
        identifier: "temporal_extent_maximum_value"
        id: "https://repo.metadatacenter.org/template-fields/29895454-7c09-4165-8499-71a14a308171"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Temporal Extent Maximum Value"
        datatype: xsd:date
        granularity: day
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/temporalExtentMaximumValue"
      - key: "Temporal Resolution"
        type: text-field
        name: "Temporal Resolution"
        description: "The nominal time interval between the measurement time of one data record and that of the following data record, in seconds. Measurement time can be considered as the beginning, end, or other known point in the measurement process.\n\nMost repeating measurement processes have some variation in the interval between measurements. If there is no planned schedule for the measurements, this value can be set to 0."
        identifier: "temporal_resolution"
        id: "https://repo.metadatacenter.org/template-fields/0adbb458-7b17-45de-8e13-b081955b0a02"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Temporal Resolution"
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/temporalResolution"
      - key: "Duration"
        type: text-field
        name: "Duration"
        description: "The total duration of data temporal coverage, specified in in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) duration format.\n\nP is the duration designator (for period) placed at the start of the duration representation.\n- Y is the year designator that follows the value for the number of calendar years.\n- M is the month designator that follows the value for the number of calendar months.\n- W is the week designator that follows the value for the number of weeks.\n- D is the day designator that follows the value for the number of calendar days.\nT is the time designator that precedes the time components of the representation.\n- H is the hour designator that follows the value for the number of hours.\n- M is the minute designator that follows the value for the number of minutes.\n- S is the second designator that follows the value for the number of seconds.\n\nThe duration format must begin with P, and include at least one designator and value; other designators may be dropped. The smallest designator may include a decimal fraction. For example, P8DT1.5H indicates a duration of 8 calendar days + 1.5 hours."
        identifier: "duration"
        id: "https://repo.metadatacenter.org/template-fields/db44971a-0cf8-4e26-bda4-e84d18e39ee6"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Duration"
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/temporalCoverageDuration"
    configuration:
      propertyIri: "http://purl.org/radx-terms/metadata-terms/temporalCoverageDescriptor"
      multiple: true
      minItems: 0
