                    modelVersion: 1.6.0
                    content: "<p><span style=\"background-color: rgb(255, 255, 255);\">Persistent and unique identifiers (PIDs) are important for unambiguous references to resources. They also&nbsp;</span>enable the connections that are critical to forming the PID Graph. They are used to identify and cite resources and to connect other resources of many kinds to the resource being described by these metadata.</p>\n\n<p>These identifiers are usually complete URLS. For example a DOI would be https://doi.org/DOI and an ORCID would be https://orcid.org/ORCID. The identifiers do not have to be DOIs or other standard identifiers. If the type of the identifier is not easily identifiable, provide it along with a type and the URI of the identifier scheme.</p>\n"
                    createdOn: "2022-04-14T13:09:58-07:00"
