type: template
name: "Human Cognitive Neuroscience Data"
id: "https://repo.metadatacenter.org/templates/7479dcb2-2c2f-44c8-953d-507c8b52c06a"
children:
  - key: "About"
    type: static-rich-text
    name: "About"
    description: "Help Text"
    prefLabel: "About"
    content: "<h3 style=\"font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; color: rgb(51, 51, 51);\">About the metadata template</h3>\n\n<p>Are afraid nobody can find your opened dataset in cognitive neuroscience?</p>\n\n<p><span style=\"background-color: rgb(255, 255, 255);\">The template aims to generate and share standardized metadata of cognitive neuroscience research projects with human subjects, to enrich publicly accessible domain-specific metadata, and subsequently enhance the discoverability/searchability and reusability of the shared resource.&nbsp;</span></p>\n\n<p>This metadata template was developed by the research team at the&nbsp;<a href=\"https://www.aesthetics.mpg.de/en.html\">Max Planck Institute of Empirical Aesthetics</a>&nbsp;in collaboration with <a href=\"https://datacite.org/\">DataCite</a>. The template was built as part of the&nbsp;<a href=\"http://ttps://doi.org/10.54224/20568\">Implementing FAIR Workflows Project</a>&nbsp;(TWCF0568), funded by the&nbsp;<a href=\"https://www.templetonworldcharity.org/\">Templeton World Charity Foundation</a>.</p>\n\n<p>The template was built with the Center for Expanded Data Annotation and Retrieval (CEDAR) Workbench. Learn more about CEDAR metadata templates&nbsp;<a href=\"https://metadatacenter.github.io/cedar-manual/sections/c1/1_template_overview/\">here</a>.</p>\n\n<p>Feel free to contact Zefan Zheng per <a href=\"mailto:zefan.zheng@ae.mpg.de\">email</a> if you have any questions about the metadata template.</p>\n\n<h3><span style=\"color: inherit; font-family: inherit;\">Tips for completing this form</span></h3>\n\n<p>1. Hover the cursor on<img alt=\"\" src=\"data:image/png;base64,\" />&nbsp;to show the field description, and on<img alt=\"\" src=\"data:image/png;base64,\" />to show the&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">ontological scope</span>&nbsp;assigned to the field.</p>\n\n<p>2. For fields assigned with ontological support, the drop-down menu may contain too many items making it hard to navigate. To ease navigation, enter the first letters of your desired value, the form will attempt to autocomplete your entry with standardized vocabulary.&nbsp;</p>\n\n<p>3. Some concepts have different expressions, enter several of them if the field does not respond with the correct terminology, i.e. try &quot;functional magnetic resonance imaging&quot; instead of &quot;fMRI&quot;.</p>\n\n<p>4. Fields or elements (multiple fields under one heading) that are repeatable are indicated by&nbsp;<img alt=\"\" src=\"data:image/png;base64,\" />at the top right corner,&nbsp;use the &quot;Copy&quot; button<img alt=\"\" src=\"data:image/png;base64,\" />&nbsp;to duplicate the field or element, or use the &quot;Toggle View&quot;<img alt=\"\" src=\"data:image/png;base64,\" />&nbsp;button to call a table view for metadata entry.</p>\n\n<p>5. Leave the field blank if the information is unavailable or not applicable.&nbsp;</p>\n"
  - key: "Dataset"
    type: element
    name: "Dataset"
    description: "Use this section to capture domain-specific information about the dataset, including data modality, acquisition technique, processing stage, domain standards used to arrange and annotate the data, and access information about source data, if available."
    children:
      - key: "Dataset instruction text"
        type: static-rich-text
        name: "Dataset instruction text"
        description: "Help Text"
        prefLabel: "Dataset instruction text"
        content: "<p>Use this section to capture domain-specific information about the dataset, including data modality, acquisition technique, processing stage, domain standards used to arrange and annotate the data, and access information about source data, if available.</p>\n\n<p>&nbsp;</p>\n"
      - key: "data modality instruction"
        type: static-rich-text
        name: "data modality instruction"
        description: "Help Text"
        prefLabel: "data modality instruction"
        content: "<p>Select the type of data collected associated with a particular technique/device. Four options including behavioural, neural, genetic, and physiologic.</p>\n"
      - key: "Data Modality"
        type: controlled-term-field
        name: "Data Modality"
        description: "type of data collected associated with a particular technique/device. including behavioural, neuroimaging, genetic, other)."
        prefLabel: "Data Modality"
        datatype: iri
        values:
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17938"
            termType: class
            termLabel: "Genetic"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17650"
            termType: class
            termLabel: "Physiologic"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C16326"
            termType: class
            termLabel: "Behavior"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C25363"
            termType: class
            termLabel: "Neural"
        configuration:
          required: true
          valueRecommendation: true
          multiple: true
          minItems: 1
      - key: "data acqusition technique instruction"
        type: static-rich-text
        name: "data acqusition technique instruction"
        description: "Help Text"
        prefLabel: "data acqusition technique instruction"
        content: "<p>If the dataset includes neuroimaging data, please indicate the procedure or technology used to collect the data. Leave this field blank if dataset does not include any neuroimaging data.</p>\n"
      - key: "Data acqusition technique"
        type: controlled-term-field
        name: "Data acqusition technique (neural data)"
        description: "Procedure or technology used to generate the dataset."
        prefLabel: "Data acqusition technique (neural data)"
        datatype: iri
        values:
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C16811"
            termType: class
            termLabel: "Magnetoencephalography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C116664"
            termType: class
            termLabel: "Electrocorticography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17958"
            termType: class
            termLabel: "Functional Magnetic Resonance Imaging"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C38054"
            termType: class
            termLabel: "Electroencephalography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17007"
            termType: class
            termLabel: "Positron Emission Tomography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C175235"
            termType: class
            termLabel: "Functional Near-Infrared Spectroscopy"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C175525"
            termType: class
            termLabel: "Conventional Magnetic Resonance Imaging"
          - type: class
            sourceAcronym: "SNOMEDCT"
            termIri: "http://purl.bioontology.org/ontology/SNOMEDCT/870257001"
            termType: class
            termLabel: "Stereoelectroencephalography"
        configuration:
          multiple: true
          minItems: 1
      - key: "Preprocessing"
        type: element
        name: "Preprocessing"
        children:
          - key: "Preprocessing status"
            type: checkbox-field
            name: "Preprocessing status"
            description: "Indicate the preprocessing status of the dataset."
            prefLabel: "Preprocessing status"
            values:
              - label: "Preprocessed"
              - label: "Raw"
            configuration:
              required: true
              minItems: 1
          - key: "Preprocessing Pipeline instruction"
            type: static-rich-text
            name: "Preprocessing Pipeline instruction"
            description: "Help Text"
            prefLabel: "Preprocessing Pipeline instruction"
            content: "<p>Information about the preprocess used to produce the dataset. Please provide the link to the documentation or publication describing the analysis process, using DOI when possible. (e.g. <a href=\"https://brainlife.io/pubs\">Brainlife</a> workflow publication).&nbsp;</p>\n\n<p><span style=\"background-color: rgb(255, 255, 255);\">Leave the field blank if not applicable.</span></p>\n"
          - key: "Analysis Pipeline"
            type: link-field
            name: "Preprocessing Pipeline"
            description: "Information about the preprocess used to produce the dataset. Please provide the link to the documentation or publication describing the analysis process, using DOI when possible. (e.g. Brainlife workflow publication).   Leave the field blank if not applicable."
            prefLabel: "Preprocessing Pipeline"
            configuration:
              multiple: true
              minItems: 1
          - key: "Preprocessing script instruction"
            type: static-rich-text
            name: "Preprocessing script instruction"
            description: "Help Text"
            prefLabel: "Preprocessing script instruction"
            content: "<p>Provide a link to the location where the preprocessing code is hosted, i.e.&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">GitHub repository.&nbsp;</span></p>\n\n<p>To ensure the accessibility and compatibility of the code, consider depositing a copy of the code together with the dataset following the <a href=\"https://datadryad.org/stash/submission_process\">Dryad submission process</a>.&nbsp; Leave the field blank if not applicable.</p>\n"
          - key: "Preprocessing Script"
            type: link-field
            name: "Preprocessing Script"
            description: "Provide a link to the location where the preprocessing code is hosted, i.e. GitHub repository.   To ensure the accessibility and compatibility of the code, consider depositing a copy of the code together with the dataset following the Dryad submission process.  Leave the field blank if not applicable."
            prefLabel: "Preprocessing Script"
            configuration:
              multiple: true
              minItems: 1
      - key: "Standard"
        type: element
        name: "Standard"
        children:
          - key: "data standard instruction"
            type: static-rich-text
            name: "data standard instruction"
            description: "Help Text"
            prefLabel: "data standard instruction"
            content: "<p>Community data standard according to which the dataset is organized. i.e. the standardized structure of data formatting and storing. Select all that&#39;s applicable,&nbsp;If choose &quot;Other&quot;, provide link to standard specification in the following field.</p>\n"
          - key: "Data Standard"
            type: multi-select-list-field
            name: "Data Standard"
            description: "Community data standard according to which the dataset is organized. i.e. the standardized structure of data formatting and storing. Select all that's applicable, If choose \"Other\", provide link to standard specification in the following field."
            prefLabel: "Data Standard"
            values:
              - label: "Brain Imaging Data Structure (BIDS)"
              - label: "Neuroimaging Data Model (NIDM)"
              - label: "Neuroscience information exchange format  (NIX)"
              - label: "Other"
            configuration:
              minItems: 1
          - key: "Reference to Data Standard instruction"
            type: static-rich-text
            name: "Reference to Data Standard instruction"
            description: "Help Text"
            prefLabel: "Reference to Data Standard instruction"
            content: "<p>Provide link to authoritative documentation on the data standard used for the dataset. Use a persistent identifier (i.e. DOI) when possible.</p>\n"
          - key: "Reference to Data Standard"
            type: link-field
            name: "Reference to Data Standard"
            description: "Provide link to authoritative documentation on the data standard used for the dataset. Use a persistent identifier (i.e. DOI) when possible."
            prefLabel: "Reference to Data Standard"
            configuration:
              multiple: true
              minItems: 1
      - key: "Source dataset"
        type: element
        name: "Source dataset"
        children:
          - key: "Source Dataset Identifier instruction"
            type: static-rich-text
            name: "Source Dataset Identifier instruction"
            description: "Help Text"
            prefLabel: "Source Dataset Identifier instruction"
            content: "<p><strong>Only relevant when uploading preprocessed or higher-level data</strong> - If the source dataset is publicly available, please provide the link here (use persistent identifier, i.e. DOI when possible).</p>\n"
          - key: "Identifier"
            type: link-field
            name: "Source Dataset Identifier"
            description: "Only relevant when uploading preprocessed or higher-level data - If the source dataset is publicly available, please provide the link here (use persistent identifier, i.e. DOI when possible)."
            prefLabel: "Source Dataset Identifier"
            configuration:
              multiple: true
              minItems: 1
          - key: "Contact person instruction"
            type: static-rich-text
            name: "Contact person instruction"
            description: "Help Text"
            prefLabel: "Contact person instruction"
            content: "<p>If the source dataset is not openly accessible, please provide contact information to the responsible person or team who can provide further information. Leave blank if not applicable.</p>\n"
          - key: "Contact person"
            type: email-field
            name: "Contact person"
            description: "If the source dataset is not openly accessible, please provide contact information to the responsible person or team who can provide further information. Leave blank if not applicable."
            prefLabel: "Contact information of data manager"
            configuration:
              multiple: true
              minItems: 1
          - key: "ORCID of data manager instruction"
            type: static-rich-text
            name: "ORCID of data manager instruction"
            description: "Help Text"
            prefLabel: "ORCID of data manager instruction"
            content: "<p>Indicate the ORCID account of the data manager: e.g.,&nbsp;https://orcid.org/0000-0001-8743-5071.</p>\n"
          - key: "ORCID"
            type: text-field
            name: "ORCID"
            description: "Please provide the ORCID of the manager of the raw data. Repeat the field to enter multiple persons."
            prefLabel: "ORCID of data manager"
            configuration:
              multiple: true
              minItems: 1
  - key: "Experiment"
    type: element
    name: "Experiment"
    children:
      - key: "Experimental Instruction text"
        type: static-rich-text
        name: "Experimental Instruction text"
        description: "Help Text"
        prefLabel: "Experimental Instruction text"
        content: "<p>This section captures experiment related information, including general area of research, links to clinical trial registration, experimental protocol, ethics approval, as well as research design, experimental paradigm used, and information about participants in the experiment.&nbsp;</p>\n\n<p>Please leave the fields blank if the information is unavailable.</p>\n"
      - key: "Area of Research instruction"
        type: static-rich-text
        name: "Area of Research instruction"
        description: "Help Text"
        prefLabel: "Area of Research instruction"
        content: "<p>The field of research that is intended for study, based on this collected dataset (e.g. memory, decision-making, consciousness, etc). The field is supported by ontological terms in the <a href=\"https://www.cognitiveatlas.org/concepts/a/\">Concept category of Cognitive Atlas Ontology</a>.&nbsp;</p>\n\n<p>This entry is supported by an auto-fill function. It is recommended to type in the most relevant word and wait for matching ontologies to show up below, among which you choose the most relevant ones. If no direct matching, try other keywords and pick one that is closest to your field.</p>\n\n<p>If no relevant matching at all, you can either forward to <a href=\"https://www.cognitiveatlas.org/\">Cognitive Atlas</a> to add your area of research to the <a href=\"https://www.cognitiveatlas.org/concepts/a/\">Concept category</a> or leave this field blank. But contribution to experimental ontology&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">building will make your research significantly more discoverable.</span></p>\n"
      - key: "Area of Research"
        type: controlled-term-field
        name: "Area of Research"
        description: "The field of research that is intended for study, based on this collected dataset (e.g. memory, decision-making, consciousness, etc). The field is supported by ontological terms in the Concept category of Cognitive Atlas Ontology.   This entry is supported by an auto-fill function. It is recommended to type in the most relevant word and wait for matching ontologies to show up below, among which you choose the most relevant ones. If no direct matching, try other keywords and pick one that is closest to your field.  If no relevant matching at all, you can either forward to Cognitive Atlas to add your area of research to the Concept category or leave this field blank. But contribution to experimental ontology building will make your research significantly more discoverable."
        prefLabel: "Area of Research"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "NIFSTD"
            sourceName: "undefined (NIFSTD)"
            termBaseIri: "http://www.cognitiveatlas.org/ontology/cogat.owl#CAO_00001"
            termBaseLabel: "Cognitive Atlas Concept"
            termMaxDepth: 0
        configuration:
          multiple: true
          minItems: 1
      - key: "Clinical Trial instruction"
        type: static-rich-text
        name: "Clinical Trial instruction"
        description: "Help Text"
        prefLabel: "Clinical Trial instruction"
        content: "<p>A clinical trial is a research study that prospectively assigns human participants or groups of humans to one or more health-related interventions to evaluate the effects on health outcomes. If the dataset is produced during a clinical trial experiment, please provide the link to the trial registration. (Use persistent identifier i.e. DOI when possible.) Leave blank if does not apply.</p>\n"
      - key: "Clinical Trial"
        type: link-field
        name: "Clinical Trial"
        description: "A clinical trial is a research study that prospectively assigns human participants or groups of humans to one or more health-related interventions to evaluate the effects on health outcomes. If the dataset is produced during a clinical trial experiment, please provide the link to the trial registration. (Use persistent identifier i.e. DOI when possible.) Leave blank if does not apply."
        prefLabel: "Clinical Trial"
        configuration:
          multiple: true
          minItems: 1
      - key: "protocol instruction"
        type: static-rich-text
        name: "protocol instruction"
        description: "Help Text"
        prefLabel: "protocol instruction"
        content: "<p>An experimental protocol is a description of procedure or list of procedures performed (see <a href=\"https://www.protocols.io/\">protocol.io</a> as reference). Provide a link to the publicly accessible record of the protocol. Use a persistent identifier i.e. DOI if possible. Leave blank if does not apply.</p>\n"
      - key: "Protocol"
        type: link-field
        name: "Protocol"
        description: "An experimental protocol is a description of procedure or list of procedures performed (see protocol.io as reference). Provide a link to the publicly accessible record of the protocol. Use a persistent identifier i.e. DOI if possible. Leave blank if does not apply."
        prefLabel: "Protocol"
        configuration:
          multiple: true
          minItems: 1
      - key: "Preregistration instruction"
        type: static-rich-text
        name: "Preregistration instruction"
        description: "Help Text"
        prefLabel: "Preregistration instruction"
        content: "<p>Preregistration is a practice of documenting your research plan at the beginning of your study and storing that plan in a read-only public repository such as <a href=\"https://osf.io/registries\">OSF Registries</a> or the National Library of Medicine&#39;s Clinical Trials Registry. Provide a link to the publicly accessible record of the preregistration. Use a persistent identifier i.e. DOI if possible. Leave blank if does not apply.</p>\n"
      - key: "Preregistration"
        type: link-field
        name: "Preregistration"
        description: "Preregistration is a practice of documenting your research plan at the beginning of your study and storing that plan in a read-only public repository such as OSF Registries or the National Library of Medicine's Clinical Trials Registry. Provide a link to the publicly accessible record of the preregistration. Use a persistent identifier i.e. DOI if possible. Leave blank if does not apply."
        prefLabel: "Preregistration"
        configuration:
          multiple: true
          minItems: 1
      - key: "Paradigm"
        type: element
        name: "Paradigm"
        children:
          - key: "Experimental Paradigm instruction"
            type: static-rich-text
            name: "Experimental Paradigm instruction"
            description: "Help Text"
            prefLabel: "Experimental Paradigm instruction"
            content: "<p>The experimental paradigms employed in the experiment to collect the dataset&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">(e.g., n-back task, attentional blink)</span>.</p>\n\n<p>This entry is supported by an auto-fill function. It is recommended to type in the most relevant word and wait for matching ontologies to show up below, among which you choose the most relevant ones. If no direct matching, try other keywords and pick one that is closest to your field.</p>\n\n<p>If no relevant matching at all, you can either forward to&nbsp;<a href=\"https://www.cognitiveatlas.org/\">Cognitive Atlas</a>&nbsp;to add your area of research to the&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">&nbsp;</span><a href=\"https://www.cognitiveatlas.org/tasks/a/\" style=\"background-color: rgb(255, 255, 255);\">Task category </a>or leave this field blank. But contribution to experimental ontology&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">building will make your research significantly more discoverable.</span></p>\n"
          - key: "Experimental Paradigm"
            type: controlled-term-field
            name: "Experimental Paradigm"
            description: "The experimental paradigms employed in the experiment to collect the dataset (e.g., n-back task, attentional blink).  This entry is supported by an auto-fill function. It is recommended to type in the most relevant word and wait for matching ontologies to show up below, among which you choose the most relevant ones. If no direct matching, try other keywords and pick one that is closest to your field.  If no relevant matching at all, you can either forward to Cognitive Atlas to add your area of research to the  Task category or leave this field blank. But contribution to experimental ontology building will make your research significantly more discoverable."
            prefLabel: "Experimental Paradigm"
            datatype: iri
            values:
              - type: ontology
                sourceAcronym: "COGAT"
                sourceName: "Cognitive Atlas Ontology"
                termCount: 4053
              - type: branch
                sourceAcronym: "COGPO"
                sourceName: "Cognitive Paradigm Ontology (COGPO)"
                termBaseIri: "http://purl.obolibrary.org/obo/OBI_0000011"
                termBaseLabel: "planned process"
                termMaxDepth: 0
            configuration:
              multiple: true
              minItems: 1
          - key: "Experimental Instruction instruction"
            type: static-rich-text
            name: "Experimental Instruction instruction"
            description: "Help Text"
            prefLabel: "Experimental Instruction instruction"
            content: "<p>The primary experimental instructions given to participants to collect the dataset.&nbsp;</p>\n\n<p>Options include: attend, count, detect, discriminate, encode, fixate, generate, imagine, move, name, read, recall, repeat, rest, sing, smile instructions, track.</p>\n\n<p>This entry is supported by an auto-fill function. Please type in the most relevant option mentioned above and wait for the matching ontology to show up below.&nbsp;</p>\n\n<p>If no relevant matching at all, please&nbsp;leave this field blank.&nbsp;</p>\n"
          - key: "Experimental Instruction"
            type: controlled-term-field
            name: "Experimental Instruction"
            description: "The primary experimental instructions given to participants to collect the dataset.   Options include: attend, count, detect, discriminate, encode, fixate, generate, imagine, move, name, read, recall, repeat, rest, sing, smile instructions, track.  This entry is supported by an auto-fill function. Please type in the most relevant option mentioned above and wait for the matching ontology to show up below.   If no relevant matching at all, please leave this field blank."
            prefLabel: "Experimental Instruction"
            datatype: iri
            values:
              - type: branch
                sourceAcronym: "COGPO"
                sourceName: "Cognitive Paradigm Ontology (COGPO)"
                termBaseIri: "http://www.cogpo.org/ontologies/CogPOver1.owl#COGPO_00028"
                termBaseLabel: "Instructions"
                termMaxDepth: 0
            configuration:
              multiple: true
              minItems: 1
          - key: "Sensory Modality instruction"
            type: static-rich-text
            name: "Sensory Modality instruction"
            description: "Help Text"
            prefLabel: "Sensory Modality instruction"
            content: "<p>If external sensory stimuli are presented during the experiment, please specify the sensory modality of the stimuli.</p>\n"
          - key: "Sensory Type"
            type: controlled-term-field
            name: "Sensory Modality"
            description: "If external sensory stimuli are presented during the experiment, please specify the sensory modality of the stimuli."
            prefLabel: "Sensory Modality"
            datatype: iri
            values:
              - type: branch
                sourceAcronym: "COGPO"
                sourceName: "undefined (COGPO)"
                termBaseIri: "http://www.cogpo.org/ontologies/CogPOver1.owl#COGPO_00124"
                termBaseLabel: "Stimulus Modality"
                termMaxDepth: 0
            configuration:
              multiple: true
              minItems: 1
          - key: "Stimulus instruction"
            type: static-rich-text
            name: "Stimulus instruction"
            description: "Help Text"
            prefLabel: "Stimulus instruction"
            content: "<p>The generic stimulus type presented to participants to collect the dataset (e.g., words, faces, breathable gas).&nbsp;</p>\n\n<p>This entry is supported by an auto-fill function. Please type in the most relevant option mentioned above and wait for the matching ontology to show up below.&nbsp;</p>\n\n<p>If no relevant matching at all, please&nbsp;leave this field blank.&nbsp;</p>\n"
          - key: "Stimulus"
            type: controlled-term-field
            name: "Stimulus"
            description: "The generic stimulus type presented to participants to collect the dataset (e.g., words, faces, breathable gas).   This entry is supported by an auto-fill function. Please type in the most relevant option mentioned above and wait for the matching ontology to show up below.   If no relevant matching at all, please leave this field blank."
            prefLabel: "Stimulus"
            datatype: iri
            values:
              - type: branch
                sourceAcronym: "COGPO"
                sourceName: "Cognitive Paradigm Ontology (COGPO)"
                termBaseIri: "http://www.cogpo.org/ontologies/CogPOver1.owl#COGPO_00122"
                termBaseLabel: "Stimulus"
                termMaxDepth: 0
            configuration:
              multiple: true
              minItems: 1
          - key: "Response instruction"
            type: static-rich-text
            name: "Response instruction"
            description: "Help Text"
            prefLabel: "Response instruction"
            content: "<p>The primary response types participants have made to create the dataset.&nbsp;</p>\n\n<p>Options include: blink, breath-hold, button press, draw, drink, extension, finger tapping, grasp, manipulate, micturate, point, saccades, smile response, speech, swallow, whistle, write, and implicit response.</p>\n\n<p>This entry is supported by a multiple-choice auto-fill function. Please type in the most relevant option mentioned above and wait for the matching ontology to show up below.&nbsp;</p>\n\n<p>If no relevant matching at all, please&nbsp;leave this field blank.&nbsp;</p>\n"
          - key: "Response"
            type: controlled-term-field
            name: "Response"
