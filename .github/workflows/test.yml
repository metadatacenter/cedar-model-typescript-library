name: Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  test:
    # Nothing here renders or screenshots, so the cheapest runner is the right one.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}

    steps:
      # One checkout. The test corpus (`cedar-test-artifacts/`) and the reference
      # templates (`cedar-artifact-library/src/test/resources/templates/`) are
      # vendored into this repository, so only the default-value check below
      # needs a sibling clone.
      - name: Check out the library
        uses: actions/checkout@v7

      # 24.22.0, the version `.nvmrc` names and CEE builds with. This was 20.20.2,
      # which outlived Node 20's own support: that line left maintenance in April
      # 2026, so every tarball published after it was built on a runtime no longer
      # receiving security patches. The whole gate — lint, typecheck, 1,168 tests and
      # the packed-consumer smoke test that imports the real tarball — passes
      # unchanged on 24.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      # Regenerates this library's YAML and compares it against the Java library's committed
      # fixtures, over every artifact and both forms. No Java toolchain is needed: the Java side is
      # read from the corpus checked in beside it. The divergences the two libraries are known to
      # have are named in the script, so one opening or closing fails here.
      - name: Verify Java/TypeScript YAML parity
        run: npm run parity:yaml

      # The lock records the exact Java and shared-corpus revisions and hashes every vendored input
      # and Java-generated fixture. TypeScript output is regenerated live, then compared as JSON
      # structure (so harmless key order and pretty-printing cannot hide or invent drift).
      - name: Verify Java lock and Java/TypeScript JSON parity
        run: npm run parity:json

      # Which field types take a declared default, and in what shape, is stated in the `permits`
      # clauses of five Java interfaces, and the check reads them from Java source. It looks for the
      # Java library beside this checkout, so fetch the one commit the lock records into that place.
      - name: Fetch the locked Java artifact library
        run: |
          repository=$(node -p "require('./itest/resources/javaArtifactLibraryLock.json').javaArtifactLibrary.repository")
          commit=$(node -p "require('./itest/resources/javaArtifactLibraryLock.json').javaArtifactLibrary.gitCommit")
          git init -q ../cedar-artifact-library
          git -C ../cedar-artifact-library fetch -q --depth 1 "$repository" "$commit"
          git -C ../cedar-artifact-library checkout -q FETCH_HEAD

      - name: Verify Java/TypeScript default-value parity
        run: npm run verify:java-defaults

      # Build the exact tarball consumers receive, install it into an isolated
      # project, and exercise CommonJS, ESM, and the shipped declarations.
      - name: Build and smoke-test the distributable
        run: npm run test:package

      # The browser job runs in the Playwright image for the version the lock resolves. This step reads
      # that version from the installed package.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The bytes the browser job tests and the publish job ships are the bytes this job built and
      # gated, so the staged tarball travels as an artifact rather than being rebuilt downstream.
      - name: Save the gated distributable
        uses: actions/upload-artifact@v7
        with:
          name: model-library-dist
          path: dist
          if-no-files-found: error
          retention-days: 2

  # The browser conformance tests run in Playwright's own image, which carries the browsers and the
  # system libraries they need, so the job downloads neither. Installing them on the runner usually
  # took under a minute, but twice it hung while apt fetched the system libraries, until the test
  # job's 15-minute limit cancelled the run.
  browser:
    name: Browser conformance
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Each Playwright release accepts only the browser builds it pins, so the image must carry the
    # version the lock resolves. The tag is derived from that version rather than written here, so an
    # update that moves the package moves the image with it, and the two cannot drift apart. `noble`
    # is Ubuntu 24.04, the release `ubuntu-latest` runs.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.test.outputs.playwright }}-noble

    steps:
      - name: Check out the library
        uses: actions/checkout@v7

      # The image carries its own Node, 24.22.1 in the v1.64.1 image. A tag can be rebuilt in place,
      # as that one was nine days after the release, so its Node can change while the tag stays the
      # same. The tests run on the version the rest of the gate uses.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install
        run: npm ci

      # The tests load `dist/policy.umd.js`, so they run against the bundle the publish job ships
      # rather than one built here.
      - name: Restore the gated distributable
        uses: actions/download-artifact@v8
        with:
          name: model-library-dist
          path: dist

      # Steps run as root, the image's default user, but HOME is a directory the runner creates and
      # its own user owns. Firefox refuses to start as root under a HOME that another user owns, so
      # the tests run with root's own home.
      - name: Verify regex conformance and bounded browser execution
        env:
          HOME: /root
        run: npm run test:browser

  # Every merge to develop reaches the Nexus dev channel. Before this existed the
  # channel moved only when somebody published by hand or a release train ran, so it
  # tracked develop in bursts and then stood still: on 2026-09-09 eleven versions went
  # out in two and a half hours, and the four commits after them reached no consumer
  # at all. A dev build that asks for the latest dev of this library has to get the
  # latest dev of this library.
  publish-dev:
    name: Publish the dev package
    needs: [test, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One publish at a time, and never cancelled: an npm version is immutable, so a
    # half-finished publish is not something a later run can tidy up.
    concurrency:
      group: publish-dev-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out the library
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0

      - name: Restore the gated distributable
        uses: actions/download-artifact@v8
        with:
          name: model-library-dist
          path: dist

      # Which of two names `dist/package.json` carries decides whether anything is
      # published here. The build copies it from `package-dist.json`, which names
      # the scoped package for a dev snapshot and the unscoped public package for a
      # release, so a release-prep commit leaves the public name on develop until
      # the commit that advances to the next development version replaces it.
      # Nothing is published from that commit, because the release it prepares
      # publishes itself to npmjs.
      #
      # Refusing it was the first behaviour here, and release 1.0.8 showed the cost:
      # a red run over a correct release, which teaches an operator to merge a red
      # run. Any other name still fails the job: a package nobody named must not
      # reach the dev channel.
      - name: Decide whether this commit publishes
        id: channel
        run: |
          public=$(node -p "require('./package.json').name")
          dev="@org.metadatacenter/${public}"
          name=$(node -p "require('./dist/package.json').name")
          case "${name}" in
            "${dev}")
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            "${public}")
              summary="Release-prep commit: dist/package.json names ${name}, the public package the release publishes to npmjs. There is no dev package to publish."
              echo "${summary}"
              echo "${summary}" >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dist/package.json names ${name}, which is neither the dev package ${dev} nor the release package ${public}." >&2
              exit 1
              ;;
          esac

      # The commit is what makes the version unique, so it is derived here rather
      # than read from package.json, whose version is written once per release and
      # then stands still across every commit until the next one.
      - name: Derive the dev version
        id: version
        if: steps.channel.outputs.publish == 'true'
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          date=$(TZ=UTC git show -s --format=%cd --date=format:%Y%m%d HEAD)
          sha=$(git rev-parse --short=7 HEAD)
          echo "version=${base}-dev.${date}.${sha}" >> "$GITHUB_OUTPUT"

      # The same two secrets every Java repository already uses to reach Nexus, so
      # this needs no new credential. npm 11 ignores a per-registry `_auth`, which
      # reaches the publish as ENEEDAUTH rather than as a rejected credential; the
      # username and a base64 password are the pair it does read. An absent secret is
      # reported here, where it names itself, rather than as that same ENEEDAUTH.
      - name: Point the scope at Nexus
        if: steps.channel.outputs.publish == 'true'
        run: |
          for name in NEXUS_USERNAME NEXUS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "${name} is empty: the Nexus secret is not available to this repository." >&2
              exit 1
            fi
          done
          {
            echo "@org.metadatacenter:registry=https://nexus.bmir.stanford.edu/repository/npm-cedar/"
            echo "//nexus.bmir.stanford.edu/repository/npm-cedar/:username=${NEXUS_USERNAME}"
            echo "//nexus.bmir.stanford.edu/repository/npm-cedar/:_password=$(printf '%s' "${NEXUS_PASSWORD}" | base64 | tr -d '\n')"
            echo "//nexus.bmir.stanford.edu/repository/npm-cedar/:always-auth=true"
          } >> .npmrc
        env:
          NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

      # Re-running a workflow on the same commit must not fail, and must not try to
      # overwrite an immutable version with different bytes.
      - name: Publish unless this commit is already published
        if: steps.channel.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name=$(node -p "require('./dist/package.json').name")
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published; nothing to do."
            exit 0
          fi
          node -e '
            const fs = require("node:fs");
            const path = "dist/package.json";
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          '
          npm publish ./dist --tag dev
          npm view "${name}@${VERSION}" version

