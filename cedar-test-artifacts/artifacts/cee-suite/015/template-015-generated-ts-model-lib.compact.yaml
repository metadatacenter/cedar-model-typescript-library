type: template
name: "rich text field"
description: "rich text field template schema generated by the CEDAR Template Editor 2.6.0"
id: "https://repo.metadatacenter.org/templates/db2cc723-ba5c-4f35-9f00-de7c830a26d9"
children:
  - key: "Rich Text Element"
    type: element
    name: "Rich Text Element"
    children:
      - key: "Controlled in Rich Text Element"
        type: controlled-term-field
        name: "Controlled in Rich Text Element"
        description: "Help Text"
        datatype: iri
        default:
          value: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C114901"
          label: "Bodily Pain"
        values:
          - type: class
            sourceAcronym: "SNOMEDCT"
            termIri: "http://purl.bioontology.org/ontology/SNOMEDCT/9354008"
            termType: class
            termLabel: "Zebra"
          - type: branch
            sourceAcronym: "NCIT"
            sourceName: "undefined (NCIT)"
            termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C3303"
            termBaseLabel: "Pain"
            termMaxDepth: 0
      - key: "Rich Text in Element"
        type: static-rich-text
        name: "Rich Text in Element"
        description: "Help Text"
        content: "<p><strong>The controlled field is populated using the search-enabled text box.</strong></p>\n\n<p><img alt=\"\" src=\"https://lowres.cartooncollections.com/fathers_day-gift-present-technical_support-holidays-seasonal-celebrations-CC122563_low.jpg\" style=\"width: 800px; height: 670px;\" /></p>\n"
      - key: "MultiSelect with Rich Text in Element"
        type: multi-select-list-field
        name: "MultiSelect with Rich Text in Element"
        description: "Help Text"
        values:
          - label: "Option 1"
          - label: "Option 2"
            selected: true
          - label: "Option 3"
            selected: true
          - label: "Option 4"
          - label: "Option 5"
        configuration:
          required: true
          minItems: 1
    configuration:
      multiple: true
      minItems: 1
  - key: "Paragraph Field"
    type: text-area-field
    name: "Paragraph Field"
    description: "Help Text"
    configuration:
      multiple: true
      minItems: 1
  - key: "Text Box Standalone Top"
    type: text-field
    name: "Text Box Standalone Top"
    description: "Help Text"
  - key: "Rich Text Standalone"
    type: static-rich-text
    name: "Rich Text Standalone"
    description: "Help Text"
    prefLabel: "Rich Text Standalone Field"
    content: "<blockquote>\n<h2><font color=\"red\"><b>This is my amazing richly formatted text between two fields</b></font></h2>\n</blockquote>\n"
  - key: "Text Box Standalone Bottom"
    type: text-field
    name: "Text Box Standalone Bottom"
    description: "Help Text"
