  - key: "Data File Dates"
    type: element
    name: "Data File Dates"
    description: "A list of relevant dates related to the data file being described. Such dates pertain to some data-file-related event, for example \"creation date\", \"submission date\" etc. Dates are specified as a pair containing the actual date (in ISO-8601 format) and the event that the date relates to. See individual fields for specific examples.\n\nThe dates of some types of events can be captured by the RADx Data Hub, for example the \"Submitted\" date/time."
    identifier: "data_file_dates"
    id: "https://repo.metadatacenter.org/template-elements/7e5203d7-25c6-447c-bc82-99b00fb462dc"
    status: draft
    version: 1.0.0
    modelVersion: 1.6.0
    createdOn: "2023-10-02T11:15:39-07:00"
    createdBy: "https://metadatacenter.org/users/30449a1f-80a8-4b54-a3fa-92d4d6157116"
    modifiedOn: "2023-10-02T11:15:39-07:00"
    modifiedBy: "https://metadatacenter.org/users/30449a1f-80a8-4b54-a3fa-92d4d6157116"
    prefLabel: "Data File Dates"
    children:
      - key: "Event Type"
        type: controlled-term-field
        name: "Event Type"
        description: "Type of Data File event that the date is associated with. The Event Type is usually considered with respect to the corresponding actor; for example, Created is typically the initial creation of the Data File by its originator, Accepted is when an ingested Data File is approved (e.g., by the Data Hub), and Updated is the time of the most recent change to the Data File."
        identifier: "event_type"
        id: "https://repo.metadatacenter.org/template-fields/99551b48-fd51-44e7-b3a7-e6a0459d51af"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Event Type"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "FDC-GDMT"
            sourceName: "https://bioportal.bioontology.org/ontologies/FDC-GDMT"
            termBaseIri: "http://vocab.fairdatacollective.org/gdmt/DateType"
            termBaseLabel: "FDC-GDMT"
            termMaxDepth: 2147483647
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/eventType"
      - key: "Date"
        type: temporal-field
        name: "Date"
        description: "The date/time that is specific to the associated event. \n\nNote that dates must be specified in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format. This format specifies date/times in a locale neutral way with temporal components ordered largest to smallest, for example year, month, day. Note that times are in 24 hour clock (military time) format, thus 13:43 is 1:43pm. When times are specified a time zone must also be specified (Z or +00:00 indicates Greenwich Mean Time).\n\nThe date time 2022-11-23T01:23:45.678-07:00 specifies November 23, 2022 at just past 1:23am Pacific Daylight Time. Hyphens and colons are optional.\n\nThe date 2022-09-23 specifies September 23, 2022 (without a time stamp). Dates are assumed GMT if no time zone is specified."
        identifier: "date"
        id: "https://repo.metadatacenter.org/template-fields/91d40e7c-1c0d-4134-8ef6-413cbf5e63f9"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Date"
        datatype: xsd:date
        granularity: day
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/eventDate"
    configuration:
      propertyIri: "http://purl.org/radx-terms/metadata-terms/eventsDescriptor"
      multiple: true
      minItems: 0
