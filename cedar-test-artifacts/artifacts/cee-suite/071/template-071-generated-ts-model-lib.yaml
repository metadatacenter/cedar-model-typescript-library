    prefLabel: "Data File Titles"
    children:
      - key: "Title"
        type: text-field
        name: "Title"
        description: "A title or descriptive name by which the Data File being described is known. This is a presentation name (i.e. title case with appropriate spacing) and is typically different from the actual file name of the data file.\n\nMultiple titles and different languages may be specified by repeating this element. The language for a given title is specified with the Language field."
        identifier: "title"
        id: "https://repo.metadatacenter.org/template-fields/c97b5a8b-841f-459d-9cc4-ee3741500710"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Title"
        configuration:
          required: true
          propertyIri: "http://purl.org/radx-terms/metadata-terms/title"
      - key: "Language"
        type: single-select-list-field
        name: "Language"
        description: "The language tag that identifies the language in which the Data File Title is provided. Languages are identified using codes that are structured in accordance with [RFC 5646](https://www.rfc-editor.org/rfc/rfc5646). If no value is specified then the default code of `en` for English is assumed."
