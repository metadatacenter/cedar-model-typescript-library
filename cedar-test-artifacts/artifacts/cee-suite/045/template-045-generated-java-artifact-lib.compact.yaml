type: template
name: "CEDAR-NCBI Human Tissue"
description: "Description of human tissue samples and sequence analysis for submission to the NCBI BioProject, BioSample, and SRA repositories, based on the BioSample Human Tissue 1.0 profile."
id: "https://repo.metadatacenter.org/templates/dc3fa214-88f4-49dd-b56b-f4552b2d3474"
children:
  - key: "Release Date"
    type: temporal-field
    name: "Release Date"
    description: "The date upon which all the submissions in this metadata form will be made publicly visible by NCBI. If this field is empty, submissions will be released immediately. (Note that release of an SRA submission also forces the release of referenced BioSample submission entries, and in turn release of the referenced BioProject.)"
    datatype: xsd:date
    granularity: day
  - key: "NCBI BioProject for Human Tissue"
    type: element
    name: "NCBI BioProject for Human Tissue"
    description: "Project description for NCBI (based on AIRR NCBI BioProject)"
    children:
      - key: "Study ID"
        type: text-field
        name: "Study ID"
        description: "Permanent identifier for each study (Example: 'PRJNA349')"
        configuration:
          required: true
      - key: "Study Title"
        type: text-field
        name: "Study Title"
        description: "Descriptive study title (Example: 'Effects of sun light exposure of the Treg repertoire')"
        configuration:
          required: true
      - key: "Study Type"
        type: controlled-term-field
        name: "Study Type"
        description: "Generic study design (Example: 'Controlled clinical trial'"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "NCIT"
            sourceName: "National Cancer Institute Thesaurus (NCIT)"
            termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C15320"
            termBaseLabel: "Study Design"
            termMaxDepth: 0
          - type: valueSet
            sourceAcronym: "CEDARVS"
            termBaseIri: "http://data.bioontology.org/provisional_classes/71d8deb0-3457-0136-2939-005056010074"
            termBaseLabel: "Negative Values"
            termCount: 3
        configuration:
          required: true
      - key: "Study Criteria"
        type: text-field
        name: "Study Criteria"
        description: "List of criteria for inclusion/exclusion for the study (Example: 'Include: Clinical P. falciparum infection; Exclude: Seropositive for HIV')"
      - key: "Contact Information"
        type: text-field
        name: "Contact Information"
        description: "Full name and other relevant contact information of the corresponding author for this dataâ\x80\x94that is, the person who is legally responsible for data collection and release. (Example: 'Peter Stibbons, +1-987-654-3210')"
        configuration:
          required: true
      - key: "Contact Email"
        type: email-field
        name: "Contact Email"
        description: "Email address of the corresponding author for this dataâ\x80\x94that is, the person who is legally responsible for data collection and release. This email will be used as the account name which has access to this data record in NCBI."
        configuration:
          required: true
      - key: "Lab Name"
        type: text-field
        name: "Lab Name"
        description: "Department of corresponding author responsible for data collection (Example: 'Department of Planar Immunology')"
        configuration:
          required: true
      - key: "Lab Address"
        type: text-field
        name: "Lab Address"
        description: "Institutional address of corresponding author responsible for data collection (Example: 'School of Medicine, Unseen University, Ankh-Morpork, Disk World')"
      - key: "Relevant Publications"
        type: text-field
        name: "Relevant Publications"
        description: "Publications describing the rationale and/or outcome of the study, using PubMed or other persistent globally unique identifiers (Example: 'PMID85642')"
  - key: "NCBI BioSample for Human Tissue"
    type: element
    name: "NCBI BioSample for Human Tissue"
    description: "Only use for human samples or cell lines that have no privacy concerns. For all studies involving human subjects, it is the submitter's responsibility to ensure that the information supplied protects participant privacy in accordance with all applicable laws, regulations and institutional policies. Make sure to remove any direct personal identifiers from your submission. If there are patient privacy concerns regarding making data fully public, please submit samples and data to NCBI's dbGaP database. dbGaP has controlled access mechanisms and is an appropriate resource for hosting sensitive patient data. For samples isolated from humans use the Pathogen, Microbe or appropriate MIxS package."
    children:
      - key: "Sample Name"
        type: text-field
        name: "Sample Name"
        description: "Sample Name is a name that you choose for the sample. It can have any format, but we suggest that you make it concise, unique and consistent within your lab, and as informative as possible. Every Sample Name from a single Submitter must be unique."
        configuration:
          required: true
      - key: "Sample Title"
        type: text-field
        name: "Sample Title"
        description: "Title of the sample"
      - key: "Organism"
        type: controlled-term-field
        name: "Organism"
        description: "Binomial designation of experimental subject's species (Example: 'Homo sapiens')"
        datatype: iri
        default:
          value: "http://purl.bioontology.org/ontology/NCBITAXON/9606"
          label: "Homo sapiens"
        values:
          - type: ontology
            sourceAcronym: "NCBITAXON-GNA"
            sourceName: "NCBITAXON Gnathostomata Module"
            termCount: 68674
        configuration:
          required: true
      - key: "Isolate"
        type: text-field
        name: "Isolate"
        description: "identification or description of the specific individual from which this sample was obtained (Example: 'SUB856413')"
        configuration:
          required: true
      - key: "Age"
        type: text-field
        name: "Age"
        description: "Age at the time of sampling; relevant scale depends on species and study, e.g. could be seconds for amoebae or centuries for trees. Provide the SI unit after the value (Examples: '65 years', '23 weeks', '15 days', '3.2 seconds'))"
        configuration:
          required: true
      - key: "Biomaterial Provider"
        type: text-field
        name: "Biomaterial Provider"
        description: "name and address of the lab or PI, or a culture collection identifier"
        configuration:
          required: true
      - key: "Sex"
        type: radio-field
        name: "Sex"
        description: "Physical sex of sampled organism (Example: 'Female')"
        values:
          - label: "male"
          - label: "female"
          - label: "pooled male and female"
          - label: "neuter"
          - label: "hermaphrodite"
          - label: "intersex"
          - label: "not determined"
          - label: "missing"
          - label: "not applicable"
          - label: "not collected"
        configuration:
          required: true
      - key: "Tissue"
        type: controlled-term-field
        name: "Tissue"
        description: "The actual tissue sampled, e.g. lymph node, liver, peripheral blood (Example: 'Bone marrow')"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "BTO"
            sourceName: "BRENDA Tissue and Enzyme Source Ontology (BTO)"
            termBaseIri: "http://purl.obolibrary.org/obo/BTO_0000000"
            termBaseLabel: "tissues, cell types and enzyme sources"
            termMaxDepth: 0
        configuration:
          required: true
      - key: "Cell Line"
        type: controlled-term-field
        name: "Cell Line"
        description: "Name of the cell line of the sample, or from which the sample was obtained. (Example: HEK293)"
        datatype: iri
        values:
          - type: ontology
            sourceAcronym: "CLO"
            sourceName: "Cell Line Ontology"
            termCount: 44874
      - key: "Cell Type"
        type: controlled-term-field
        name: "Cell Type"
        description: "Type of cell of the sample or from which the sample was obtained. (Example: PBMC)"
        datatype: iri
        values:
          - type: ontology
            sourceAcronym: "CL"
            sourceName: "Cell Ontology"
            termCount: 10586
      - key: "Cell Subtype"
        type: controlled-term-field
        name: "Cell Subtype"
        description: "Sub type of cell of the sample or from which the sample was obtain (Example: 'B cell')"
        datatype: iri
        values:
          - type: ontology
            sourceAcronym: "CL"
            sourceName: "Cell Ontology"
            termCount: 10586
      - key: "Culture Collection"
        type: text-field
        name: "Culture Collection"
        description: "Name of source institute and unique culture identifier. See the description for the proper format and list of allowed institutes, http://www.insdc.org/controlled-vocabulary-culturecollection-qualifier. Format is Value format: \"<institution-code>:[<collection-code>:]<culture_id>\" (Example: 'ATCC:26370')"
      - key: "Development Stage"
        type: text-field
        name: "Development Stage"
        description: "Developmental stage at the time of sampling (Example: '1 day after inoculation')"
      - key: "Disease"
        type: controlled-term-field
        name: "Disease"
        description: "List of diseases diagnosed; can include multiple diagnoses. Select from Disease Ontology (https://bioportal.bioontology.org/ontologies/DOID/?p=classes). (Example: 'adrenal medulla carcinoma, myeloid sarcoma')"
        datatype: iri
        values:
          - type: ontology
            sourceAcronym: "DOID"
            sourceName: "Human Disease Ontology"
            termCount: 12694
      - key: "Disease Stage"
        type: text-field
        name: "Disease Stage"
        description: "Stage of disease at the time of sampling."
      - key: "Ethnicity"
        type: text-field
        name: "Ethnicity"
        description: "IHMC code for ethnicity of the subject, integer or text (Examples: 01=Hispanic or Latino or Spanish, 02=Non-Hispanic or Non-Latino or Non-Spanish)"
      - key: "Health State"
        type: text-field
        name: "Health State"
        description: "Health or disease status of sample at time of collection"
      - key: "Karyotype"
        type: text-field
        name: "Karyotype"
        description: "The number and visual appearance of the chromosomes in the cell nuclei of an organism or species."
      - key: "Phenotype"
        type: text-field
        name: "Phenotype"
        description: "Phenotype of sampled organism."
      - key: "Population"
        type: text-field
        name: "Population"
        description: "The full, unabbreviated population descriptor from the Coriell Institute"
      - key: "Race"
        type: controlled-term-field
        name: "Race"
        description: "Racial group of subject (as defined by NIH) (Examples: 'White', 'American Indian or Alaska Native', 'Black', 'Asian', 'Native Hawaiian or Other Pacific Islander', 'Other')"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "NCIT"
            sourceName: "National Cancer Institute Thesaurus (NCIT)"
            termBaseIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17049"
            termBaseLabel: "Race"
            termMaxDepth: 0
      - key: "Sample Type"
        type: text-field
        name: "Sample Type"
        description: "Sample type, such as cell culture, mixed culture, tissue sample, whole organism, single cell, metagenomic assembly"
      - key: "Treatment"
        type: text-field
        name: "Treatment"
        description: "Description of the treatment protocol for the subject from whom this sample was obtained"
      - key: "Sample Description"
        type: text-field
        name: "Sample Description"
        description: "Description of the sample"
    configuration:
      multiple: true
      minItems: 1
  - key: "NCBI SRA for Human Tissue"
    type: element
    name: "NCBI SRA for Human Tissue"
    description: "For each BioSample described in the previous section, describe the corresponding SRA information here. Each sample must have a file type and filename entered that correspond to one of the files provided with the submission. Additional attributes may be specified for each sample using the Optional SRA Attribute-Value fields."
    children:
      - key: "Sample Name"
        type: text-field
        name: "Sample Name"
        description: "BioSample Accession or Sample Name assigned by submitter, unique within study. This needs to match the Sample Name in the corresponding BioSample entry. (Example: 'SUP52415')"
        configuration:
          required: true
      - key: "Library ID"
        type: text-field
        name: "Library ID"
        description: "Short unique identifier for the sequencing library. Each Library ID MUST be unique! (Example: 'Homo-sapiens-UTSoM-T19273')"
        configuration:
          required: true
      - key: "Title"
        type: text-field
        name: "Title"
        description: "Short description that will identify the dataset on public pages. A clear and concise formula for the title is of the form:  {methodology} of {organism}: {sample info}  (Example: `RNA-Seq of mus musculus: adult female spleen`)"
        configuration:
          required: true
      - key: "Library Strategy"
        type: single-select-list-field
        name: "Library Strategy"
        description: "Sequencing strategy used in the experiment (Example: 'RNA-Seq')"
        values:
          - label: "WGA"
          - label: "WGS"
          - label: "WXS"
          - label: "RNA-Seq"
          - label: "miRNA-Seq"
          - label: "WCS"
          - label: "CLONE"
          - label: "POOLCLONE"
          - label: "AMPLICON"
          - label: "CLONEEND"
          - label: "FINISHING"
          - label: "ChIP-Seq"
          - label: "MNase-Seq"
          - label: "DNase-Hypersensitivity"
          - label: "Bisulfite-Seq"
          - label: "Tn-Seq"
          - label: "EST"
          - label: "FL-cDNA"
          - label: "CTS"
          - label: "MRE-Seq"
          - label: "MeDIP-Seq"
          - label: "MBD-Seq"
          - label: "Synthetic-Long-Read"
          - label: "ATAC-seq"
          - label: "ChIA-PET"
          - label: "FAIRE-seq"
          - label: "Hi-C"
          - label: "ncRNA-Seq"
          - label: "RAD-Seq"
          - label: "RIP-Seq"
          - label: "SELEX"
          - label: "ssRNA-seq"
          - label: "Targeted-Capture"
          - label: "Tethered Chromatin Conformation Capture"
          - label: "OTHER"
        configuration:
          required: true
      - key: "Library Source"
        type: radio-field
        name: "Library Source"
        description: "Type of genetic source material sequenced in the experiment (Example: 'Metagenomic')"
        values:
          - label: "GENOMIC"
          - label: "TRANSCRIPTOMIC"
          - label: "METAGENOMIC"
          - label: "METATRANSCRIPTOMIC"
          - label: "SYNTHETIC"
          - label: "VIRAL RNA"
          - label: "GENOMIC SINGLE CELL"
          - label: "TRANSCRIPTOMIC SINGLE CELL"
          - label: "OTHER"
        configuration:
          required: true
      - key: "Library Selection"
        type: single-select-list-field
        name: "Library Selection"
        description: "Method of selection or enrichment used in the Experiment (Example: 'RANDOM-PCR')"
        values:
          - label: "RANDOM"
          - label: "PCR"
          - label: "RANDOM PCR"
          - label: "RT-PCR"
          - label: "HMPR"
          - label: "MF"
          - label: "CF-S"
          - label: "CF-M"
          - label: "CF-H"
          - label: "CF-T"
          - label: "MDA"
          - label: "MSLL"
          - label: "cDNA"
          - label: "ChIP"
          - label: "MNase"
          - label: "DNAse"
          - label: "Hybrid Selection"
          - label: "Reduced Representation"
          - label: "Restriction Digest"
          - label: "5-methylcytidine antibody"
          - label: "MBD2 protein methyl-CpG binding domain"
          - label: "CAGE"
          - label: "RACE"
          - label: "size fractionation"
          - label: "Padlock probes capture method"
          - label: "other"
          - label: "unspecified"
          - label: "cDNA_oligo_dT"
          - label: "cDNA_randomPriming"
          - label: "Inverse rRNA"
          - label: "Oligo-dT"
          - label: "PolyA"
          - label: "repeat fractionation"
        configuration:
          required: true
      - key: "Library Layout"
        type: text-field
        name: "Library Layout"
        description: "Number, order, orientation, and distance of associated reads (Example: '2 Kbp paired ends')"
        configuration:
          required: true
      - key: "Platform"
        type: radio-field
        name: "Platform"
        description: "Designation of sequencing instrument used (Example: 'Alumina LoSeq 1000')"
        values:
          - label: "LS454"
          - label: "ABI_SOLID"
          - label: "BGISEQ"
          - label: "CAPILLARY"
          - label: "COMPLETE_GENOMICS"
          - label: "HELICOS"
          - label: "ILLUMINA"
          - label: "ION_TORRENT"
          - label: "OXFORD_NANOPORE"
          - label: "PACBIO_SMRT"
          - label: "Other"
        configuration:
          required: true
      - key: "Instrument Model"
        type: text-field
        name: "Instrument Model"
        description: "Model identifier of the instrument used to perform the sequencing. Acceptable instrument models may be viewed at https://sramongo.readthedocs.io/en/latest/sraConstants.html#instrument-models. (Examples: 'Illumina HiSeq 2000', '"
        configuration:
          required: true
      - key: "Design Description"
        type: text-field
        name: "Design Description"
        description: "Free-form description of the methods used to create the sequencing library; a brief 'materials and methods' section."
        configuration:
          required: true
      - key: "Optional SRA Attribute"
        type: attribute-value-field
        name: "Optional SRA Attribute"
        description: "Enter the name of the optional attribute, followed by the value of that attribute. Add additional attributes as needed."
        prefLabel: "Optional SRA Attribute-Value"
        configuration:
          minItems: 0
      - key: "File Type"
        type: radio-field
        name: "File Type"
        description: "Type of the raw data file. Must be one of the acceptable file types, including bam, sra, kar, srf, sff, fastq, tab, 454_native, Helicos_native, SOLiD_native_csfasta, SOLiD_native_qual, SOLiD_native, PacBio_HDF5, CompleteGenomics_native, bam_header, reference_fasta. For multiple files of different types, enter one File Type per file, separated by commas."
        values:
          - label: "sra-run-fastq"
          - label: "sra-run-bam"
          - label: "sra-run-sff"
          - label: "sra-run-Helicos_native"
          - label: "sra-run-PacBio_HDF5"
          - label: "sra-run-CompleteGenomics_native"
          - label: "sra-run-OxfordNanopore_native"
        configuration:
          required: true
      - key: "File Name"
        type: attribute-value-field
        name: "File Name"
        description: "Enter the name of the raw data file into the Value field of each attribute-value pair. Each name must match the name of a file selected for upload. (The attributes are automatically named as 'filename1', 'filename2', etc..)"
        configuration:
          minItems: 0
    configuration:
      multiple: true
      minItems: 1
  - key: "Notations for NCBI Human Element"
    type: element
    name: "Notations for NCBI Human Element"
    description: "Provides detailed description of the template, and allows user to enter annotations of instances."
    children:
      - key: "Template Annotations"
        type: static-rich-text
        name: "Template Annotations"
        description: "An overview of this template, with an optional field for user notes."
        content: "<p><strong>About this Metadata Form (template)</strong></p>\n\n<p>The NCBI Human Element template was created by adapting the MiAIRR NCBI template to be appropriate for the more general Human Elements 1.0 package of NCBI.&nbsp;</p>\n\n<p>This is a submission template to deposit &lsquo;Human; version 1.0&rsquo; samples to the NCBI BioSample database (https://www.ncbi.nlm.nih.gov/biosample/). Only use for human samples or cell lines that have no privacy concerns. (Please see descriptive help for the BioSample element for more details.)</p>\n\n<p>Fields with an asterisk (*) are mandatory. Your submission will fail if any mandatory fields are not completed. If information is unavailable for any mandatory field, please enter &lsquo;not collected&rsquo;, &lsquo;not applicable&rsquo; or &lsquo;missing&rsquo; as appropriate.</p>\n\n<p>All other fields are optional. Leave optional fields empty if no information is available.</p>\n\n<p>Once your metadata is complete, go to the Workspace and choose this metadata file&#39;s Submit menu item. A window will appear to let you choose your files to submit with the metadata, and to complete the submission.</p>\n\n<p>This template was created by Syed Ahmad Chan of Yale University, with support of John Graybeal and Marcos Martinez Romero of Stanford University, on behalf of the CEDAR project. Instructions and citation information may be found at&nbsp;<a href=\"https://github.com/metadatacenter/pipelines/wiki/CEDAR-NCBI-SRA-Pipeline\">https://github.com/metadatacenter/pipelines/wiki/CEDAR-NCBI-SRA-Pipeline</a>.&nbsp;</p>\n\n<p><b>How to Add User Notes (optional)</b></p>\n\n<p>You may enter any notes you wish to make about this collection of metadata in the field below. The notes will not be sent to NCBI or made part of the submission; it will be saved within CEDAR as reference information.&nbsp;</p>\n"
      - key: "User Annotations"
        type: text-area-field
        name: "User Annotations"
        description: "Enter any notes you wish to make about this metadata instance (e.g., how it was created, any open questions, or notes for the historical record.) The information will not be included with your submission to NCBI."
  - key: "submission_pipeline"
    type: text-field
    name: "submission_pipeline"
    description: "Specifies the CEDAR submission pipeline that will be used to process metadata created using this template."
    default: "NCBI-HUMAN"
    configuration:
      hidden: true
