type: template
name: "RADx Metadata Specification"
description: "Template generated by CEDARCSV"
identifier: "radx-metadata-specification"
id: "https://repo.metadatacenter.org/templates/c691629c-1183-4425-9a12-26201eab1a10"
children:
  - key: "Data Characteristics Summary"
    type: element
    name: "Data Characteristics Summary"
    description: "Characteristics of the data within the data file, particularly of the cohorts in the data file. This section provides multiple ways to enter such information; it is only necessary to enter the information in one of these formats."
    identifier: "data_characteristics_summary"
    prefLabel: "Data Characteristics Summary"
    children:
      - key: "Data Characteristics Table in HTML"
        type: text-area-field
        name: "Data Characteristics Table in HTML"
        description: "Formatted HTML code for a table of summary statistics."
        identifier: "data_characteristics_table_in_html"
        prefLabel: "Data Characteristics Table in HTML"
      - key: "Data Characteristics Table in CSV"
        type: text-area-field
        name: "Data Characteristics Table in CSV"
        description: "Enter comma-separated values containing summary statistics characterizing this data file."
        identifier: "data_characteristics_table_in_csv"
        prefLabel: "Data Characteristics Table in CSV"
      - key: "Data Characteristics Table in TSV"
        type: text-field
        name: "Data Characteristics Table in TSV"
        description: "Enter tab-separated values containing summary statistics characterizing this data file."
        identifier: "data_characteristics_table_in_tsv"
        prefLabel: "Data Characteristics Table in TSV"
      - key: "Data Characteristics Table in Key-Value Pairs"
        type: attribute-value-field
        name: "Data Characteristics Table in Key-Value Pairs"
        description: "Enter the name of the characteristic being described in the first (key) field, and the value for that characteristic in the second (value) field. Note this is a repeating field and so can support multiple key-value pairs."
        identifier: "data_characteristics_table_in_key-value_pairs"
        prefLabel: "Data Characteristics Table in Key-Value Pairs"
        configuration:
          minItems: 0
