    prefLabel: "Size"
    configuration:
      multiple: true
      minItems: 0
  - key: "format"
    type: text-field
    name: "format"
    description: "Technical format of the resource. Use file extension or MIME type where possible, e.g., PDF, XML, MPG or application/pdf, text/xml, video/mpeg."
    prefLabel: "Format"
    configuration:
      multiple: true
      minItems: 0
