  - key: "Data File Identity"
    type: element
    name: "Data File Identity"
    description: "Information used to identify the Data File being described."
    identifier: "data_file_identity"
    id: "https://repo.metadatacenter.org/template-elements/8c7a2e0d-77ed-4b74-b949-4ca638abcf1d"
    status: draft
    version: 1.0.0
    modelVersion: 1.6.0
    createdOn: "2023-10-02T11:15:39-07:00"
    createdBy: "https://metadatacenter.org/users/30449a1f-80a8-4b54-a3fa-92d4d6157116"
    modifiedOn: "2023-10-02T11:15:39-07:00"
    modifiedBy: "https://metadatacenter.org/users/30449a1f-80a8-4b54-a3fa-92d4d6157116"
    prefLabel: "Data File Identity"
    children:
      - key: "Identifier"
        type: text-field
        name: "Identifier"
        description: "A globally unique string that identifies the Data File being described. It is typically a DOI (Digital Object Identifier) or IRI (International Resource Identifier, or Web address). The identifier is typically generated by data providers or data publishers who wish to have a citable and Web-accessible resource.\n\nExample DOIs are `doi:10.1000/182` or `https://doi.org/10.1000/182`, both of which identify the DOI Handbook, which has a DOI of 10.1000/182\n\nSee also:  [https://en.wikipedia.org/wiki/Digital_object_identifier](https://en.wikipedia.org/wiki/Digital_object_identifier)"
        identifier: "identifier"
        id: "https://repo.metadatacenter.org/template-fields/6ebb5e25-2b53-4b75-8fff-d7d68f7cb5d7"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Identifier"
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/identifier"
      - key: "Identifier Type"
        type: controlled-term-field
        name: "Identifier Type"
        description: "The identifier type used to identify the resource being described.\n\nThis need not be provided if the identifier is either a DOI that begins with \"doi:\" or \"https://doi.org/\", or it is an IRI that begins with either \"http://\" or \"https://\" "
        identifier: "identifier_type"
        id: "https://repo.metadatacenter.org/template-fields/76e0ffac-06f1-4244-aef0-7b6ddd8a752a"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Identifier Type"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "FDC-GDMT"
            sourceName: "https://bioportal.bioontology.org/ontologies/FDC-GDMT"
            termBaseIri: "http://vocab.fairdatacollective.org/gdmt/IdentifierType"
            termBaseLabel: "FDC-GDMT"
            termMaxDepth: 2147483647
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/identifierType"
      - key: "File Name"
        type: text-field
        name: "File Name"
        description: "The local name of the resource (for example, in a file-based operating system or web service)."
        identifier: "file_name"
        id: "https://repo.metadatacenter.org/template-fields/a6e4c88a-bd0a-4e50-90d2-8db025201c87"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "File Name"
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/fileName"
      - key: "Version"
        type: text-field
        name: "Version"
        description: "The string identifying the version of the data file or other resource being described.\n\nThis field accepts any version string, but we suggest that you use semantic versioning of the form `major.minor.patch`. for example, `2.1.4`."
        identifier: "version"
        id: "https://repo.metadatacenter.org/template-fields/25195922-0ecb-4842-870a-ea6c4efb2edd"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "Version"
        configuration:
          propertyIri: "http://purl.org/radx-terms/metadata-terms/version"
      - key: "SHA256 digest"
        type: text-field
        name: "SHA256 digest"
        description: "A SHA256 digest of the Data File contents. This is a 64 characters long hexadecimal string. \n\nFor example, the SHA256 digest of the string, \"RADx Data Hub\" is `ebff8d3da88b292622d3bfc36bdac4c4537ddc56cb07f344c5223d6b6f9cd011`.\n\nOn macOS the following command may be used to generate the SHA256 digest of a file.\n\n```\nshasum -a 256 /path/to/file\n```"
        identifier: "sha256_digest"
        id: "https://repo.metadatacenter.org/template-fields/fff03f4d-0808-4568-bb2b-39961f2c4e8b"
        status: draft
        version: 1.0.0
        modelVersion: 1.6.0
        prefLabel: "SHA256 digest"
        configuration:
          propertyIri: "https://purl.org/radx-terms/sha256"
    configuration:
      propertyIri: "http://purl.org/radx-terms/metadata-terms/identityDescriptor"
