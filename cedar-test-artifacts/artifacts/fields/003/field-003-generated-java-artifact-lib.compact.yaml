type: "temporal-field"
name: "Study Start Date"
description: "The official start date for the study for which this data file was created. This date must be in the ISO-8601 format of yyyy-mm-dd. For example, 2022-10-05 specifies October 5, 2022.\n\nThis field is considered auxiliary information to the initially registered Study Start Date. It will not update the registered information, but may trigger a verification that the registered Start Date has not changed."
identifier: "study_start_date"
id: "https://repo.metadatacenter.org/template-fields/ddd47aa9-923e-4b00-bff3-aea907a95ed2"
prefLabel: "Study Start Date"
datatype: "xsd:date"
granularity: "day"
