type: template
name: "DataCite V4.4 Dec01"
id: "https://repo.metadatacenter.org/templates/f2c2d19d-d94c-420e-80bd-77a9d65e5dc7"
children:
  - key: "prefix"
    type: text-field
    name: "prefix"
    description: "Help Text"
    prefLabel: "Prefix of DOI"
    configuration:
      required: true
  - key: "url"
    type: link-field
    name: "url"
    description: "The location of the landing page with more information about the resource."
    prefLabel: "URL"
    configuration:
      required: true
  - key: "creator"
    type: element
    name: "creator"
    prefLabel: "Creators"
    children:
      - key: "creatorName"
        type: text-field
        name: "creatorName"
        description: "May be a corporate/institutional or personal name."
        prefLabel: "Creator Name"
        configuration:
          required: true
      - key: "nameType"
        type: controlled-term-field
        name: "nameType"
        description: "The type of name: Personal or Organizational"
        prefLabel: "Name Type"
        datatype: iri
        values:
          - type: class
            sourceAcronym: "PATEL"
            termIri: "http://www.semanticweb.org/ambrish/ontologies/2020/10/untitled-ontology-24#Personal"
            termType: class
            termLabel: "Personal"
          - type: class
            sourceAcronym: "VIVO"
            termIri: "http://www.w3.org/2006/vcard/ns#Organizational"
            termType: class
            termLabel: "Organizational"
      - key: "givenName"
        type: text-field
        name: "givenName"
        description: "The personal or first name of the creator"
        prefLabel: "First Name of Creator"
      - key: "familyName"
        type: text-field
        name: "familyName"
        description: "The surname or last name of the creator"
        prefLabel: "Last Name of Creator"
      - key: "affiliation"
        type: element
        name: "affiliation"
        prefLabel: "Affiliations"
        children:
          - key: "name"
            type: text-field
            name: "name"
            description: "The organizational or institutional affiliation."
            prefLabel: "Name"
          - key: "affiliationIdentifier"
            type: text-field
            name: "affiliationIdentifier"
            description: "Uniquely identifies the organizational affiliation."
            prefLabel: "Affiliation Identifier"
          - key: "affiliationIdentifierScheme"
            type: text-field
            name: "affiliationIdentifierScheme"
            description: "The name of the affiliation identifier scheme."
            prefLabel: "Affiliation Identifier Scheme"
          - key: "schemeURI"
            type: link-field
            name: "schemeURI"
            description: "The URI of the affiliation identifier scheme"
            prefLabel: "Scheme URI"
        configuration:
          multiple: true
          minItems: 0
      - key: "nameIdentifier"
        type: element
        name: "nameIdentifier"
        prefLabel: "Name Identifiers"
        children:
          - key: "name"
            type: text-field
            name: "name"
            description: "Uniquely identifies an individual or legal entity, according to various schemes."
            prefLabel: "Name"
          - key: "nameIdentifierScheme"
            type: text-field
            name: "nameIdentifierScheme"
            description: "If Name Identifier is used, Name Identifier Scheme is mandatory."
            prefLabel: "Name Identifier Scheme"
          - key: "schemeURI"
            type: link-field
            name: "schemeURI"
            description: "The URI of the name identifier scheme"
            prefLabel: "Scheme URI"
        configuration:
          multiple: true
          minItems: 0
    configuration:
      multiple: true
      minItems: 1
  - key: "title"
    type: element
    name: "title"
    prefLabel: "Titles"
    children:
      - key: "title"
        type: text-field
        name: "title"
        description: "A name or title by which a resource is known."
        prefLabel: "Title"
        configuration:
          required: true
      - key: "titleType"
        type: controlled-term-field
        name: "titleType"
        description: "The type of Title (other than the Main Title)"
        prefLabel: "Title Type"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "DATACITE-VOCAB"
            sourceName: "DATACITE V4.4 (DATACITE-VOCAB)"
            termBaseIri: "http://purl.org/datacite/v4.4/TitleType"
            termBaseLabel: "Title Type"
            termMaxDepth: 0
    configuration:
      multiple: true
      minItems: 1
  - key: "publisher"
    type: text-field
    name: "publisher"
    description: "The name of the entity that holds, archives, publishes prints, distributes, releases, issues, or produces the resource."
    prefLabel: "Publisher"
    default: "CEDAR"
    configuration:
      required: true
  - key: "publicationYear"
    type: temporal-field
    name: "publicationYear"
    description: "The year when the data was or will be made publicly available."
    prefLabel: "Publication Year"
    datatype: xsd:date
    granularity: year
    configuration:
      required: true
  - key: "resourceType"
    type: radio-field
    name: "resourceType"
    description: "A description of the resource"
    prefLabel: "Resource Type"
    values:
      - label: "Template"
      - label: "Instance"
    configuration:
      required: true
  - key: "subject"
    type: element
    name: "subject"
    prefLabel: "Subjects"
    children:
      - key: "subject"
        type: text-field
        name: "subject"
        description: "Subject, keyword, classification code, or key phrase describing the resource"
        prefLabel: "Subject"
      - key: "subjectScheme"
        type: text-field
        name: "subjectScheme"
        description: "The name of the subject scheme or classification code or authority if one is used"
        prefLabel: "Subject Scheme"
      - key: "schemeURI"
        type: link-field
        name: "schemeURI"
        description: "The URI of the subject identifier scheme"
        prefLabel: "Scheme URI"
      - key: "valueURI"
        type: link-field
        name: "valueURI"
        description: "The URI of the subject term"
        prefLabel: "Value URI"
      - key: "classificationCode"
        type: text-field
        name: "classificationCode"
        description: "The classification code used for the subject term in the subject scheme"
        prefLabel: "Classification Code"
    configuration:
      multiple: true
      minItems: 0
  - key: "contributor"
    type: element
    name: "contributor"
    prefLabel: "Contributors"
    children:
      - key: "contributorName"
        type: text-field
        name: "contributorName"
        description: "The full name of the contributor"
        prefLabel: "Contributor Name"
      - key: "nameType"
        type: controlled-term-field
        name: "nameType"
        description: "Name Type"
        prefLabel: "Name Type"
        datatype: iri
        values:
          - type: class
            sourceAcronym: "PATEL"
            termIri: "http://www.semanticweb.org/ambrish/ontologies/2020/10/untitled-ontology-24#Personal"
            termType: class
            termLabel: "Personal"
          - type: class
            sourceAcronym: "VIVO"
            termIri: "http://www.w3.org/2006/vcard/ns#Organizational"
            termType: class
            termLabel: "Organizational"
      - key: "givenName"
        type: text-field
        name: "givenName"
        prefLabel: "First Name of Contributor"
      - key: "familyName"
        type: text-field
        name: "familyName"
        prefLabel: "Last Name of Contributor"
      - key: "contributorType"
        type: controlled-term-field
        name: "contributorType"
        prefLabel: "Contributor Type"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "DATACITE-VOCAB"
            sourceName: "undefined (DATACITE-VOCAB)"
            termBaseIri: "http://purl.org/datacite/v4.4/ContributorType"
            termBaseLabel: "Contributor Type"
            termMaxDepth: 0
      - key: "affiliation"
        type: element
        name: "affiliation"
        prefLabel: "Affiliations"
        children:
          - key: "name"
            type: text-field
            name: "name"
            description: "The organizational or institutional affiliation."
            prefLabel: "Name"
          - key: "affiliationIdentifier"
            type: text-field
            name: "affiliationIdentifier"
            description: "Uniquely identifies the organizational affiliation."
            prefLabel: "Affiliation Identifier"
          - key: "affiliationIdentifierScheme"
            type: text-field
            name: "affiliationIdentifierScheme"
            description: "The name of the affiliation identifier scheme."
            prefLabel: "Affiliation Identifier Scheme"
          - key: "schemeURI"
            type: link-field
            name: "schemeURI"
            description: "The URI of the affiliation identifier scheme"
            prefLabel: "Scheme URI"
        configuration:
          multiple: true
          minItems: 0
      - key: "nameIdentifier"
        type: element
        name: "nameIdentifier"
        prefLabel: "Name Identifiers"
        children:
          - key: "name"
            type: text-field
            name: "name"
            description: "Uniquely identifies an individual or legal entity, according to various schemes."
            prefLabel: "Name"
          - key: "nameIdentifierScheme"
            type: text-field
            name: "nameIdentifierScheme"
            description: "If Name Identifier is used, Name Identifier Scheme is mandatory."
            prefLabel: "Name Identifier Scheme"
          - key: "schemeURI"
            type: link-field
            name: "schemeURI"
            description: "The URI of the name identifier scheme"
            prefLabel: "Scheme URI"
        configuration:
          multiple: true
          minItems: 0
    configuration:
      multiple: true
      minItems: 0
  - key: "date"
    type: element
    name: "date"
    prefLabel: "Dates"
    children:
      - key: "date"
        type: temporal-field
        name: "date"
        description: "Different dates relevant to the work"
        prefLabel: "Date"
        datatype: xsd:date
        granularity: day
      - key: "dateType"
        type: controlled-term-field
        name: "dateType"
        description: "If Date is used, Date Type is mandatory."
        prefLabel: "Date Type"
        datatype: iri
        values:
          - type: branch
            sourceAcronym: "DATACITE-VOCAB"
            sourceName: "undefined (DATACITE-VOCAB)"
            termBaseIri: "http://purl.org/datacite/v4.4/DateType"
            termBaseLabel: "Date Type"
            termMaxDepth: 0
      - key: "dateInformation"
        type: text-field
        name: "dateInformation"
        description: "Specific information about the date, if appropriate"
        prefLabel: "Date Information"
    configuration:
      multiple: true
      minItems: 0
