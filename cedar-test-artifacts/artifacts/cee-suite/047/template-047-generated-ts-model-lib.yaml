  - key: "Additional Documentation Guidance"
    type: static-rich-text
    name: "Additional Documentation Guidance"
    description: "Please enter identifiers for related documentation. (could be URLs)"
    id: "https://repo.metadatacenter.org/template-fields/aefe9a0b-e65a-4ae3-b1c1-4f9aca441342"
    modelVersion: 1.6.0
    content: "<p><b>Additional Documentation</b></p>\n<p>Many types of documentation can be used to describe the sources and processing steps that are used to create new data. Identifiers for that documentation can be used to 1) make connections and 2) help users understand details of the lineage and processes.</p>\n"
    createdOn: "2022-04-27T11:22:45-07:00"
    createdBy: "https://metadatacenter.org/users/e5cef076-e98c-4d60-b271-22f0fa509597"
