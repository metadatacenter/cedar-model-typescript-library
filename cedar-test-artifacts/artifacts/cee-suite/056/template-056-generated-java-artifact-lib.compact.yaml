type: template
name: "Human Cognitive Neuroscience Data - Part 2"
id: "https://repo.metadatacenter.orgx/templates/5af7fae2-ec0c-4d64-b420-ae4ecda43f3b"
children:
  - key: "About"
    type: static-rich-text
    name: "About"
    description: "Help Text"
    prefLabel: "About"
    content: "<h3><span style=\"color: inherit; font-family: inherit;\">Tips for completing this form</span></h3>\n\n<p>1. Hover the cursor on<img alt=\"\" src=\"data:image/png;base64,\" />&nbsp;to show the field description, and on<img alt=\"\" src=\"data:image/png;base64,\" />to show the&nbsp;<span style=\"background-color: rgb(255, 255, 255);\">ontological scope</span>&nbsp;assigned to the field.</p>\n\n<p>2. For fields assigned with ontological support, the drop-down menu may contain too many items making it hard to navigate. To ease navigation, enter the first letters of your desired value, the form will attempt to autocomplete your entry with standardized vocabulary.&nbsp;</p>\n\n<p>3. Some concepts have different expressions, enter several of them if the field does not respond with the correct terminology, i.e. try &quot;functional magnetic resonance imaging&quot; instead of &quot;fMRI&quot;.</p>\n\n<p>4. Fields or elements (multiple fields under one heading) that are repeatable are indicated by&nbsp;<img alt=\"\" src=\"data:image/png;base64,\" />at the top right corner,&nbsp;use the &quot;Copy&quot; button<img alt=\"\" src=\"data:image/png;base64,\" />&nbsp;to duplicate the field or element, or use the &quot;Toggle View&quot;<img alt=\"\" src=\"data:image/png;base64,\" />&nbsp;button to call a table view for metadata entry.</p>\n\n<p>5. Leave the field blank if the information is unavailable or not applicable.&nbsp;</p>\n\n<h3 style=\"font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif; color: rgb(51, 51, 51);\">About the metadata template</h3>\n\n<p>This metadata template was developed by the research team led by Professor Lucia Melloni at the&nbsp;<a href=\"https://www.aesthetics.mpg.de/en.html\">Max Planck Institute of Empirical Aesthetics</a>. The template was built as part of the&nbsp;<a href=\"http://ttps://doi.org/10.54224/20568\">Implementing FAIR Workflows Project</a>&nbsp;(TWCF0568), funded by the&nbsp;<a href=\"https://www.templetonworldcharity.org/\">Templeton World Charity Foundation</a>.</p>\n\n<p>The template aims to generate and share standardized metadata of cognitive neuroscience research projects with human subjects, to enrich publicly accessible domain-specific metadata, and subsequently enhance the discoverability/ seaand reusability of the shared resource.&nbsp;</p>\n\n<p>The template was built with the Center for Expanded Data Annotation and Retrieval (CEDAR) Workbench. Learn more about CEDAR metadata templates&nbsp;<a href=\"https://metadatacenter.github.io/cedar-manual/sections/c1/1_template_overview/\">here</a>.</p>\n"
  - key: "About the template"
    type: text-field
    name: "About the template"
    description: "Help Text"
    prefLabel: "About the template"
    default: "Click to read the instruction"
  - key: "Dataset"
    type: element
    name: "Dataset"
    description: "Use this section to capture domain-specific information about the dataset, including data modality, acquisition technique, processing stage, domain standards used to arrange and annotate the data, and access information about source data, if available."
    children:
      - key: "Dataset instruction text"
        type: static-rich-text
        name: "Dataset instruction text"
        description: "Help Text"
        prefLabel: "Dataset instruction text"
        content: "<p>Use this section to capture domain-specific information about the dataset, including data modality, acquisition technique, processing stage, domain standards used to arrange and annotate the data, and access information about source data, if available.</p>\n\n<p>&nbsp;</p>\n"
      - key: "Dataset instruction"
        type: text-field
        name: "Dataset instruction"
        description: "Help Text"
        prefLabel: "Dataset instruction"
        default: "Click to read instructions"
      - key: "data modality instruction"
        type: static-rich-text
        name: "data modality instruction"
        description: "Help Text"
        prefLabel: "data modality instruction"
        content: "<p>Select the type of data collected associated with a particular technique/device. Options including behavioural, neuroimaging, genetic, other). Leave the field blank if not applicable.</p>\n"
      - key: "Data Modality"
        type: controlled-term-field
        name: "Data Modality"
        description: "type of data collected associated with a particular technique/device. including behavioural, neuroimaging, genetic, other)."
        prefLabel: "Data Modality"
        datatype: iri
        values:
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17938"
            termType: class
            termLabel: "Genetic"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17650"
            termType: class
            termLabel: "Physiologic"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C16326"
            termType: class
            termLabel: "Behavior"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C173635"
            termType: class
            termLabel: "Neuroimaging"
        configuration:
          valueRecommendation: true
      - key: "data acqusition technique instruction"
        type: static-rich-text
        name: "data acqusition technique instruction"
        description: "Help Text"
        prefLabel: "data acqusition technique instruction"
        content: "<p>If the dataset includes neuroimaging data, please indicate the procedure or technology used to collect the data. Leave this field blank if dataset does not include any neuroimaging data.</p>\n"
      - key: "Data acqusition technique"
        type: controlled-term-field
        name: "Data acquisition technique (Neural data)"
        description: "If the dataset includes neuroimaging data, please indicate the procedure or technology used to collect the data. Leave this field blank if dataset does not include any neuroimaging data."
        prefLabel: "Data acquisition technique (Neural data)"
        datatype: iri
        values:
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C16811"
            termType: class
            termLabel: "Magnetoencephalography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C116664"
            termType: class
            termLabel: "Electrocorticography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17958"
            termType: class
            termLabel: "Functional Magnetic Resonance Imaging"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C38054"
            termType: class
            termLabel: "Electroencephalography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C17007"
            termType: class
            termLabel: "Positron Emission Tomography"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C175235"
            termType: class
            termLabel: "Functional Near-Infrared Spectroscopy"
          - type: class
            sourceAcronym: "NCIT"
            termIri: "http://ncicb.nci.nih.gov/xml/owl/EVS/Thesaurus.owl#C175525"
            termType: class
            termLabel: "Conventional Magnetic Resonance Imaging"
        configuration:
          multiple: true
          minItems: 1
      - key: "Preprocessing"
        type: element
        name: "Preprocessing"
        children:
          - key: "Preprocessing Pipeline instruction"
            type: static-rich-text
            name: "Preprocessing Pipeline instruction"
            description: "Help Text"
            prefLabel: "Preprocessing Pipeline instruction"
            content: "<p>Information about the preprocess used to produce the dataset. Please provide the link to the documentation describing the analysis process, using DOI when possible. (e.g. <a href=\"https://brainlife.io/pubs\">Brainlife</a> workflow publication)</p>\n"
          - key: "Analysis Pipeline"
            type: link-field
            name: "Preprocessing Pipeline"
            description: "Information about the preprocess used to produce the dataset. Please provide the link to the documentation describing the analysis process, using DOI when possible. (e.g. Brainlife workflow publication https://brainlife.io/pubs)"
            prefLabel: "Preprocessing Pipeline"
            configuration:
              multiple: true
              minItems: 1
          - key: "Preprocessing script instruction"
            type: static-rich-text
            name: "Preprocessing script instruction"
            description: "Help Text"
            prefLabel: "Preprocessing script instruction"
            content: "<p>Provide a link to the GitHub repository hosting the preprocessing code.&nbsp;</p>\n\n<p>To ensure the accessibility and compatibility of the code, consider depositing a copy of the code together with the dataset following the <a href=\"https://datadryad.org/stash/submission_process\">Dryad submission process</a>.&nbsp;&nbsp;</p>\n"
          - key: "Preprocessing Script"
            type: link-field
            name: "Preprocessing Script"
            description: "Provide a link to the GitHub repository hosting the preprocessing code."
            prefLabel: "Preprocessing Script"
            configuration:
              multiple: true
              minItems: 1
        configuration:
          multiple: true
          minItems: 1
      - key: "Standard"
        type: element
        name: "Standard"
        prefLabel: "Standard"
        children:
          - key: "data standard instruction"
            type: static-rich-text
            name: "data standard instruction"
            description: "Help Text"
            prefLabel: "data standard instruction"
            content: "<p>Community data standard according to which the dataset is organized.</p>\n"
          - key: "Data Standard"
            type: multi-select-list-field
            name: "Data Standard"
            description: "Community data standard according to which the dataset is organized."
            prefLabel: "Data Standard"
            values:
              - label: "Brain Imaging Data Structure (BIDS)"
              - label: "Neuroimaging Data Model (NIDM)"
              - label: "Neuroscience information exchange format  (NIX)"
              - label: "Other"
            configuration:
              minItems: 1
          - key: "Reference to Data Standard instruction"
            type: static-rich-text
            name: "Reference to Data Standard instruction"
            description: "Help Text"
            prefLabel: "Reference to Data Standard instruction"
            content: "<p>Provide link to authoritative documentation on the data standard used for the dataset. Use a persistent identifier (i.e. DOI) when possible.</p>\n"
          - key: "Reference to Data Standard"
            type: link-field
            name: "Reference to Data Standard"
            description: "Provide link to authoritative documentation on the data standard used for the dataset. Use presistent identifier (i.e. DOI) when possible."
            prefLabel: "Reference to Data Standard"
            configuration:
              multiple: true
              minItems: 1
        configuration:
          multiple: true
          minItems: 1
      - key: "Source dataset"
        type: element
        name: "Source dataset"
        prefLabel: "Source dataset"
        children:
          - key: "Source Dataset Identifier instruction"
            type: static-rich-text
            name: "Source Dataset Identifier instruction"
            description: "Help Text"
            prefLabel: "Source Dataset Identifier instruction"
            content: "<p><strong>Only relevant when uploading preprocessed or higher-level data</strong> - If the source dataset is publicly available, please provide the link here (use persistent identifier, i.e. DOI when possible).</p>\n"
          - key: "Identifier"
            type: link-field
            name: "Source Dataset Identifier"
            description: "If the source dataset is publicly available, please provide the link here (use persistent identifier, i.e. DOI when possible)."
            prefLabel: "Source Dataset Identifier"
            configuration:
              multiple: true
              minItems: 1
          - key: "Contact person instruction"
            type: static-rich-text
            name: "Contact person instruction"
            description: "Help Text"
            prefLabel: "Contact person instruction"
            content: "<p>If the source dataset is not openly accessible, please provide contact information to the responsible person or team who can provide further information. Leave blank if not applicable.</p>\n"
          - key: "Contact person"
            type: email-field
            name: "Contact person"
            description: "If the source dataset is not openly accessible, please provide contact information to the responsible person or team who can provide further information."
            prefLabel: "Contact information of data manager"
            configuration:
              multiple: true
              minItems: 1
          - key: "ORCID"
            type: text-field
            name: "ORCID"
            description: "Please provide the ORCID of the manager of the raw data. Repeat the field to enter multiple persons."
            prefLabel: "ORCID of data manager"
            default: "i.e. https://orcid.org/0000-0001-8743-5071"
            configuration:
              multiple: true
              minItems: 1
        configuration:
          overrideDescription: "If the dataset is preprocessed, please provide information on the source data here."
          multiple: true
          minItems: 1
