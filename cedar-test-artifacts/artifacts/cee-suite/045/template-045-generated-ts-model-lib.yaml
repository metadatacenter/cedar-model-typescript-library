    modifiedBy: "https://metadatacenter.org/users/cd36dea6-9222-412b-99ab-bec50f6ecd00"
    children:
      - key: "Template Annotations"
        type: static-rich-text
        name: "Template Annotations"
        description: "An overview of this template, with an optional field for user notes."
        id: "https://repo.metadatacenter.org/template-fields/111290cb-34a4-43b9-b1da-330a6f944370"
        modelVersion: 1.6.0
        content: "<p><strong>About this Metadata Form (template)</strong></p>\n\n<p>The NCBI Human Element template was created by adapting the MiAIRR NCBI template to be appropriate for the more general Human Elements 1.0 package of NCBI.&nbsp;</p>\n\n<p>This is a submission template to deposit &lsquo;Human; version 1.0&rsquo; samples to the NCBI BioSample database (https://www.ncbi.nlm.nih.gov/biosample/). Only use for human samples or cell lines that have no privacy concerns. (Please see descriptive help for the BioSample element for more details.)</p>\n\n<p>Fields with an asterisk (*) are mandatory. Your submission will fail if any mandatory fields are not completed. If information is unavailable for any mandatory field, please enter &lsquo;not collected&rsquo;, &lsquo;not applicable&rsquo; or &lsquo;missing&rsquo; as appropriate.</p>\n\n<p>All other fields are optional. Leave optional fields empty if no information is available.</p>\n\n<p>Once your metadata is complete, go to the Workspace and choose this metadata file&#39;s Submit menu item. A window will appear to let you choose your files to submit with the metadata, and to complete the submission.</p>\n\n<p>This template was created by Syed Ahmad Chan of Yale University, with support of John Graybeal and Marcos Martinez Romero of Stanford University, on behalf of the CEDAR project. Instructions and citation information may be found at&nbsp;<a href=\"https://github.com/metadatacenter/pipelines/wiki/CEDAR-NCBI-SRA-Pipeline\">https://github.com/metadatacenter/pipelines/wiki/CEDAR-NCBI-SRA-Pipeline</a>.&nbsp;</p>\n\n<p><b>How to Add User Notes (optional)</b></p>\n\n<p>You may enter any notes you wish to make about this collection of metadata in the field below. The notes will not be sent to NCBI or made part of the submission; it will be saved within CEDAR as reference information.&nbsp;</p>\n"
        createdOn: "2019-05-16T08:49:56-07:00"
        createdBy: "https://metadatacenter.org/users/1adf5ee5-cee0-47d1-9769-efbe00cdebee"
        modifiedOn: "2019-05-16T08:49:56-07:00"
        modifiedBy: "https://metadatacenter.org/users/1adf5ee5-cee0-47d1-9769-efbe00cdebee"
      - key: "User Annotations"
        type: text-area-field
        name: "User Annotations"
        description: "Enter any notes you wish to make about this metadata instance (e.g., how it was created, any open questions, or notes for the historical record.) The information will not be included with your submission to NCBI."
        id: "https://repo.metadatacenter.org/template-fields/c7a1daef-65ef-4194-a452-c65db7beb090"
