type: template
name: "#010 Template with DateTime field"
children:
  - key: "Simple date"
    type: temporal-field
    name: "Simple date"
    description: "Help text"
    prefLabel: "Simple date preferred"
    datatype: xsd:date
    granularity: day
  - key: "Simple time"
    type: temporal-field
    name: "Simple time"
    description: "Help Text"
    prefLabel: "Simple time preferred"
    datatype: xsd:time
    granularity: second
    inputTimeFormat: 12h
    inputTimeZone: true
  - key: "Complex datetime"
    type: temporal-field
    name: "Complex datetime"
    description: "Help Text 2"
    prefLabel: "Complex datetime preferred"
    altLabels:
      - "Alt label 1"
      - "Alt label 2"
    datatype: xsd:dateTime
    granularity: decimalSecond
    inputTimeFormat: 12h
    inputTimeZone: true
    configuration:
      required: true
      multiple: true
      minItems: 1
