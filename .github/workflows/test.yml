name: Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Nothing here renders or screenshots, so the cheapest runner is the right one.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # One checkout. The test corpus (`cedar-test-artifacts/`) and the reference
      # templates (`cedar-artifact-library/src/test/resources/templates/`) are
      # vendored into this repository, so nothing has to be assembled from
      # sibling clones.
      - name: Check out the library
        uses: actions/checkout@v7

      # 24.19.0, the version `.nvmrc` names and CEE builds with. This was 20.20.2,
      # which outlived Node 20's own support: that line left maintenance in April
      # 2026, so every tarball published after it was built on a runtime no longer
      # receiving security patches. The whole gate — lint, typecheck, 954 tests and
      # the packed-consumer smoke test that imports the real tarball — passes
      # unchanged on 24.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      # Regenerates this library's YAML and compares it against the Java library's committed
      # fixtures, over every artifact and both forms. No Java toolchain is needed: the Java side is
      # read from the corpus checked in beside it. The divergences the two libraries are known to
      # have are named in the script, so one opening or closing fails here.
      - name: Verify Java/TypeScript YAML parity
        run: npm run parity:yaml

      # Build the exact tarball consumers receive, install it into an isolated
      # project, and exercise CommonJS, ESM, and the shipped declarations.
      - name: Build and smoke-test the distributable
        run: npm run test:package
