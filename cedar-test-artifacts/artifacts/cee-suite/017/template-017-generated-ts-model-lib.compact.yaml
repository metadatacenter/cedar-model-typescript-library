    name: "Datetime Field 2 (time)"
    description: "Help Text"
    datatype: xsd:time
    granularity: decimalSecond
    inputTimeFormat: 12h
    inputTimeZone: true
  - key: "Datetime Field 3 (datetime no timezone)"
    type: temporal-field
    name: "Datetime Field 3 (datetime no timezone)"
    description: "Help Text"
    datatype: xsd:dateTime
    granularity: decimalSecond
    inputTimeFormat: 12h
    inputTimeZone: false
  - key: "Datetime Field 4 (datetime multiple)"
    type: temporal-field
    name: "Datetime Field 4 (datetime multiple)"
    description: "Help Text"
    datatype: xsd:dateTime
    granularity: second
