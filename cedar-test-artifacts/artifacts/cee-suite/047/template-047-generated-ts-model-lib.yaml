                modelVersion: 1.6.0
                content: "<p><b>Entering Organization Name and Identifier</b></p>\n<p>Unambiguously identifying organizations requires a name and a persistent identifier. \nFor organizations, the <a href=\"https:.//ror.org\">Research Organization Registry</a> is a \ncommunity-supported source of organizational identifiers. Check ROR to see if your \norganization has a ROR. If yes, enter the name of the organization and the ROR.</p>\n<p>Note: ROR is generally limited to high-level organization names, i.e. Universities rather \nthen Departments. Select the name closest to the organization you are naming.</p> "
