                    content: "<p>Related identifiers enable the connections that are critical to forming the PID Graph. They are used to connect resources of many kinds to the resource being described by these metadata.</p> \n<p>These identifiers are usually complete URLS. For example a DOI would be https://doi.org/DOI. The identifiers do not have to be DOIs or other standard identifiers. If the type of the identifier is not universally identifiable, provide it along with the URI of the identifier scheme.</p>\n"
