  - key: "Statement Guidance"
    type: static-rich-text
    name: "Statement Guidance"
    description: "Help Text"
    id: "https://repo.metadatacenter.org/template-fields/e26ee124-bb0e-4447-8aa5-434b3b9a0bf0"
    modelVersion: 1.6.0
    content: "<p><b>Statement</b></p>\n\n<p>Lineage information can be provided as 1) structured descriptions of process steps, processing, inputs and outputs or 2) a descriptive statement.</p>\n\n<p>Detailed information about process steps with inputs, outputs, and processing are more useful for users that are trying to understand and reproduce results using the metadata or for those analyzing other data using the same or similar techniques. They are also useful for users trying to use software provided with the dataset(s).</p>\n\n<p>In some situations, a descriptive statement is all that is available. In those cases, provide a statement that is sufficient to help a reader of the high-level metadata understand what was done.</p>\n\n<p>Including a statement and detailed descriptions is most useful for a wide range of users and use cases.</p>\n"
    createdOn: "2022-04-27T11:22:45-07:00"
    createdBy: "https://metadatacenter.org/users/e5cef076-e98c-4d60-b271-22f0fa509597"
    modifiedOn: "2022-04-27T11:22:45-07:00"
    modifiedBy: "https://metadatacenter.org/users/e5cef076-e98c-4d60-b271-22f0fa509597"
