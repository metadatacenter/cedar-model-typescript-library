type: template
name: "eDNA ECT Demonstration"
description: "An initial template for demonstrating the embedded editor."
id: "https://repo.metadatacenter.org/templates/30f40c2b-0fe2-4ad5-a130-d7329d0e6b50"
children:
  - key: "Spatial Box and keyword"
    type: element
    name: "Spatial Box and keyword"
    description: "Bounding box or keywords"
    children:
      - key: "SpatialCoverage"
        type: element
        name: "SpatialCoverage"
        description: "The geospatial area (region on Earth) covered by the dataset being described."
        children:
          - key: "eastBoundLongitude"
            type: numeric-field
            name: "eastBoundLongitude"
            description: "The most east longitude of a bounding box representing an area of dataset collection."
            prefLabel: "East Longitudinal Boundary"
            datatype: xsd:decimal
            minValue: -180
            maxValue: 180
          - key: "westBoundLongitude"
            type: numeric-field
            name: "westBoundLongitude"
            description: "The most west longitude of a bounding box representing an area of dataset collection."
            prefLabel: "West Longitudinal Boundary"
            datatype: xsd:decimal
            minValue: -180
            maxValue: 180
          - key: "southBoundLatitude"
            type: numeric-field
            name: "southBoundLatitude"
            description: "The most south latitude of a bounding box representing an area of dataset collection."
            prefLabel: "South Latitude Boundary"
            datatype: xsd:decimal
            minValue: -90
            maxValue: 90
          - key: "northBoundLatitude"
            type: numeric-field
            name: "northBoundLatitude"
            description: "The most north latitude of a bounding box representing an area of dataset collection."
            prefLabel: "North Latitude Boundary"
            datatype: xsd:decimal
            minValue: -180
            maxValue: 180
        configuration:
          multiple: true
          minItems: 1
      - key: "PlaceName"
        type: text-field
        name: "PlaceName"
        description: "A name of the geographic region where the data were collected"
        prefLabel: "PlaceName"
        configuration:
          multiple: true
          minItems: 1
  - key: "Species Targeted"
    type: radio-field
    name: "Species Targeted"
    description: "What kind of species were being targeted?"
    values:
      - label: "Species at Risk (SAR)"
      - label: "Invasive Alien Species (IAS)"
      - label: "Valued Ecosystem Component (VEC)"
      - label: "Indicator"
  - key: "Software"
    type: text-field
    name: "Software"
    description: "Software used in extraction and analysis"
    prefLabel: "Software"
  - key: "eDNA Sampling"
    type: element
    name: "eDNA Sampling"
    description: "Description of eDNA sampling"
    children:
      - key: "Sampling Depth"
        type: numeric-field
        name: "Sampling Depth"
        description: "Depth of the sample"
        prefLabel: "SamplingDepth"
        datatype: xsd:decimal
        unit: "Meters"
      - key: "Distance From Shore"
        type: numeric-field
        name: "Distance From Shore"
        description: "How far was the sample location from the nearest shore?"
        prefLabel: "DistanceFromShore"
        datatype: xsd:decimal
      - key: "Preservation of Sample"
        type: text-field
        name: "Preservation of Sample"
        description: "What method was used to preserve the samples?"
        prefLabel: "PreservationOfSample"
  - key: "Collection DateTime"
    type: temporal-field
    name: "Collection DateTime"
    description: "When were the data collected?"
    prefLabel: "Collection Date Time"
    datatype: xsd:dateTime
    granularity: second
    inputTimeFormat: 12h
    inputTimeZone: true
    configuration:
      multiple: true
      minItems: 1
