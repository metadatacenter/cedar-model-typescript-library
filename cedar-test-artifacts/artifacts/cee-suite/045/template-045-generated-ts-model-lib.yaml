  - key: "Notations for NCBI Human Element"
    type: element
    name: "Notations for NCBI Human Element"
    description: "Provides detailed description of the template, and allows user to enter annotations of instances."
    id: "https://repo.metadatacenter.org/template-elements/1be1b5ca-674b-483a-914d-9b78aea2fb41"
    status: draft
    version: 0.0.1
    modelVersion: 1.6.0
    createdOn: "2019-06-10T21:34:07-07:00"
    createdBy: "https://metadatacenter.org/users/cd36dea6-9222-412b-99ab-bec50f6ecd00"
